# Rendered only into the uniquely owned disposable cluster/namespace.
apiVersion: v1
kind: Pod
metadata:
  name: server-a
  labels: {app: flannel-policy-proof, proof-role: server-a}
spec:
  automountServiceAccountToken: false
  securityContext: {runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534}
  containers:
    - name: fixture
      image: FIXTURE_IMAGE
      imagePullPolicy: Never
      env: [{name: POD_NAME, value: server-a}]
      args: ["-mode=server"]
      securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
      resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 200m, memory: 64Mi}}
---
apiVersion: v1
kind: Pod
metadata:
  name: server-b
  labels: {app: flannel-policy-proof, proof-role: server-b}
spec:
  automountServiceAccountToken: false
  securityContext: {runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534}
  containers:
    - name: fixture
      image: FIXTURE_IMAGE
      imagePullPolicy: Never
      env: [{name: POD_NAME, value: server-b}]
      args: ["-mode=server"]
      securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
      resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 200m, memory: 64Mi}}
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  labels: {app: flannel-policy-proof, proof-role: client}
spec:
  automountServiceAccountToken: false
  securityContext: {runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534}
  containers:
    - name: fixture
      image: FIXTURE_IMAGE
      imagePullPolicy: Never
      args: ["-mode=idle"]
      securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
      resources: {requests: {cpu: 5m, memory: 8Mi}, limits: {cpu: 100m, memory: 32Mi}}
