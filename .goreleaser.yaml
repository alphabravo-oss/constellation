version: 2
project_name: constellationctl

before:
  hooks:
    - go mod tidy

builds:
  - id: constellationctl
    main: ./cmd/constellationctl
    binary: constellationctl
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64]
    ldflags:
      - -s -w -X main.version={{.Version}}

  - id: constellation-github-app
    main: ./cmd/constellation-github-app
    binary: constellation-github-app
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: constellationctl
    ids: [constellationctl]
    formats: [tar.gz]
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

  - id: constellation-github-app
    ids: [constellation-github-app]
    formats: [tar.gz]
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Tag }}-next"

# Docker image consumed by the CI templates as `constellation/cli:<tag>`.
# Skipped on `goreleaser release --snapshot` unless --skip docker is overridden.
dockers:
  - id: cli-amd64
    ids: [constellationctl]
    image_templates:
      - "ghcr.io/alphabravocompany/constellation-cli:{{ .Version }}-amd64"
      - "ghcr.io/alphabravocompany/constellation-cli:latest-amd64"
      - "ghcr.io/alphabravocompany/constellation-cli:{{ .Version }}"
      - "ghcr.io/alphabravocompany/constellation-cli:latest"
      - "constellation/cli:{{ .Version }}-amd64"
      - "constellation/cli:latest-amd64"
      - "constellation/cli:{{ .Version }}"
      - "constellation/cli:latest"
    dockerfile: Dockerfile.cli
    use: buildx
    goos: linux
    goarch: amd64
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.source=https://github.com/alphabravo-oss/constellation"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.title=constellation-cli"
