# Sample values for Google Kubernetes Engine with Cloud SQL (external mode).

image:
  tag: v0.3.0

postgres:
  mode: external
  existingSecret: constellation-cloudsql-credentials
  existingSecretKey: url

tls:
  certManager:
    enabled: true
    issuer: letsencrypt-prod
    issuerKind: ClusterIssuer
  bootstrap:
    enabled: false

ingress:
  enabled: true
  className: gce
  host: constellation.example.com
  annotations:
    networking.gke.io/managed-certificates: constellation-cert
    kubernetes.io/ingress.global-static-ip-name: constellation-ip

api:
  replicas: 3
scanner:
  replicas: 4
admission:
  replicas: 3
