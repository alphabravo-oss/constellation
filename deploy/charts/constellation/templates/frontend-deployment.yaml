{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "constellation.fullname" . }}-frontend-nginx
  labels: {{- include "constellation.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }
        # Vite build output under /assets/ is content-hashed → safe to cache immutably.
        location ^~ /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
        # Stable-named static files (favicon, logos, icons) — revalidate so replacing
        # them actually reaches browsers instead of sticking in the immutable cache.
        location ~* \.(?:svg|png|ico|jpg|jpeg|gif|webp|woff2?)$ {
            expires 1h;
            add_header Cache-Control "public, max-age=3600, must-revalidate";
        }
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
        location /api/ {
            proxy_pass http://{{ include "constellation.fullname" . }}-api:{{ .Values.api.service.port }};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Stream API responses — do NOT buffer. Buffering large JSON (e.g. the
            # /findings list, ~450KB) to the proxy temp dir truncated the body and
            # blanked the page. Streaming needs no temp file. Generous timeouts for
            # big/slow reports.
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
        location /openapi.json {
            proxy_pass http://{{ include "constellation.fullname" . }}-api:{{ .Values.api.service.port }};
        }
        location /healthz { return 200; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "constellation.fullname" . }}-frontend
  labels: {{- include "constellation.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "constellation.name" . }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "constellation.name" . }}
        app.kubernetes.io/component: frontend
    spec:
      {{- include "constellation.pullSecrets" . | nindent 6 }}
      {{- include "constellation.podSecurityContext" . | nindent 6 }}
      automountServiceAccountToken: false
      initContainers:
        - name: prepare-nginx-state
          image: {{ .Values.initBundle.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p \
                /var/lib/nginx/tmp/client_body \
                /var/lib/nginx/tmp/proxy \
                /var/lib/nginx/tmp/fastcgi \
                /var/lib/nginx/tmp/uwsgi \
                /var/lib/nginx/tmp/scgi \
                /var/cache/nginx/client_temp \
                /var/cache/nginx/proxy_temp \
                /var/cache/nginx/fastcgi_temp \
                /var/cache/nginx/uwsgi_temp \
                /var/cache/nginx/scgi_temp \
                /var/run
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-lib
              mountPath: /var/lib/nginx
            - name: tmp
              mountPath: /tmp
      containers:
        - name: nginx
          image: {{ include "constellation.roleImage" (dict "ctx" . "role" "frontend") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-lib
              mountPath: /var/lib/nginx
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ include "constellation.fullname" . }}-frontend-nginx
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-lib
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "constellation.fullname" . }}-frontend
  labels: {{- include "constellation.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "constellation.name" . }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.service.targetPort }}
      protocol: TCP
{{- end }}
