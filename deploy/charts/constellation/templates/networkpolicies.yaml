{{ if ne (include "constellation.postgresMode" .) "external" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "constellation.fullname" . }}-postgres-ingress
  labels: {{- include "constellation.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "constellation.name" . }}
      app.kubernetes.io/component: postgres
  policyTypes:
    - Ingress
  ingress:
{{ if eq (include "constellation.postgresMode" .) "cnpg" }}
    # CNPG streaming replication + instance-to-instance traffic between the
    # cluster's own pods (all share component=postgres via inheritedMetadata).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "constellation.name" . }}
              app.kubernetes.io/component: postgres
      ports:
        - protocol: TCP
          port: 5432
    # CNPG's operator reaches every instance manager on its status port.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicies.cnpgOperator.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicies.cnpgOperator.podLabels | nindent 14 }}
{{ range .Values.networkPolicies.kubeAPI.cidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
{{ end }}
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 5432
{{ end }}
{{ if .Values.api.enabled }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "constellation.name" . }}
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 5432
{{ end }}
{{ if .Values.migrate.enabled }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "constellation.name" . }}
              app.kubernetes.io/component: migrate
      ports:
        - protocol: TCP
          port: 5432
{{ end }}
{{ if and .Values.bootstrap.enabled (not .Values.initBundle.secretName) }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "constellation.name" . }}
              app.kubernetes.io/component: bootstrap
      ports:
        - protocol: TCP
          port: 5432
{{ end }}
{{ if .Values.bootstrap.admin.enabled }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "constellation.name" . }}
              app.kubernetes.io/component: bootstrap-admin
      ports:
        - protocol: TCP
          port: 5432
{{ end }}
{{ if and .Values.admission.enabled (or (and .Values.admission.quarantine.enabled .Values.admission.quarantine.clusterId) .Values.admission.policies.enabled .Values.admission.audit.enabled) }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "constellation.name" . }}
              app.kubernetes.io/component: admission
      ports:
        - protocol: TCP
          port: 5432
{{ end }}
{{ if .Values.auditArchiver.enabled }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "constellation.name" . }}
              app.kubernetes.io/component: audit-archiver
      ports:
        - protocol: TCP
          port: 5432
{{ end }}
{{ if .Values.kubernetesComplianceCollector.enabled }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "constellation.name" . }}
              app.kubernetes.io/component: k8s-compliance-collector
      ports:
        - protocol: TCP
          port: 5432
{{ end }}
{{ if .Values.discoverer.enabled }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "constellation.name" . }}
              app.kubernetes.io/component: discoverer
      ports:
        - protocol: TCP
          port: 5432
{{ end }}
{{ end }}
{{ if eq (include "constellation.postgresMode" .) "cnpg" }}
---
# CNPG instance pods must initiate egress (replicas → primary on 5432, and the
# instance manager → kube API). The legacy StatefulSet was a passive server and
# needed no egress policy, so default-deny would otherwise break CNPG HA.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "constellation.fullname" . }}-postgres-egress
  labels: {{- include "constellation.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "constellation.name" . }}
      app.kubernetes.io/component: postgres
  policyTypes:
    - Egress
  egress:
{{ include "constellation.networkPolicyDNSEgress" . | nindent 4 }}
{{ include "constellation.networkPolicyKubeAPIEgress" . | nindent 4 }}
{{ if .Values.postgres.cloudnativepg.backup }}
{{ include "constellation.networkPolicyExternalHTTPEgress" . | nindent 4 }}
{{ end }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "constellation.name" . }}
              app.kubernetes.io/component: postgres
      ports:
        - protocol: TCP
          port: 5432
{{ end }}
