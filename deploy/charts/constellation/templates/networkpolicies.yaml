  name: {{ include "constellation.fullname" . }}-frontend
  labels: {{- include "constellation.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "constellation.name" . }}
      app.kubernetes.io/component: frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
{{ range .Values.networkPolicies.frontendIngressCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
{{ end }}
      ports:
        - protocol: TCP
          port: 8080
  egress:
{{ include "constellation.networkPolicyDNSEgress" . | nindent 4 }}
{{ if .Values.api.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "constellation.name" . }}
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 8080
{{ end }}
{{ end }}
{{ if and .Values.api.enabled (or .Values.frontend.enabled .Values.scanner.enabled .Values.runtimeAgent.enabled .Values.discoverer.enabled .Values.operator.enabled .Values.admission.enabled .Values.networkPolicyApplier.enabled .Values.kubernetesComplianceCollector.enabled .Values.vulndbImporter.enabled .Values.auditArchiver.enabled (gt (len .Values.networkPolicies.apiIngressCIDRs) 0)) }}
