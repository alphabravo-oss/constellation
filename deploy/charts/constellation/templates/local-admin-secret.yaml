{{- if and .Values.auth.local.bootstrap.enabled (not .Values.auth.local.bootstrap.existingSecret) }}
{{- $name := printf "%s-local-admin" (include "constellation.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "constellation.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
{{- if $existing }}
  password: {{ index $existing.data "password" | quote }}
  totp-secret: {{ index $existing.data "totp-secret" | quote }}
{{- else }}
  password: {{ randAlphaNum 40 | b64enc | quote }}
  totp-secret: {{ randAlpha 40 | upper | b64enc | quote }}
{{- end }}
{{- end }}
