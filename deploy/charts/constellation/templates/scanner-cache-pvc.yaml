{{- include "constellation.validateScannerCache" . -}}
{{- if and .Values.scanner.enabled .Values.scanner.cache.persistent (not .Values.scanner.cache.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "constellation.scannerCacheClaim" . | quote }}
  {{- if .Values.scanner.cache.retain }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
  labels:
    {{- include "constellation.labels" . | nindent 4 }}
    app.kubernetes.io/component: scanner
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.scanner.cache.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.scanner.cache.size | quote }}
{{- end }}
