{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "constellation.fullname" . }}-api
  labels: {{- include "constellation.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  replicas: {{ .Values.api.replicas }}
{{- if or (and .Values.api.pcapStorage.enabled (eq .Values.api.pcapStorage.accessMode "ReadWriteOnce")) (and .Values.complianceScheduler.enabled (eq .Values.complianceScheduler.storage.accessMode "ReadWriteOnce")) }}
  strategy:
    type: Recreate
{{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "constellation.name" . }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "constellation.name" . }}
        app.kubernetes.io/component: api
      {{- if .Values.api.metrics.annotations }}
      # Annotation-based scrape discovery. Metrics live on the admin listener
      # (:9090), never on the API port.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
      {{- end }}
    spec:
      {{- include "constellation.pullSecrets" . | nindent 6 }}
      {{- include "constellation.podSecurityContext" . | nindent 6 }}
      {{- include "constellation.haTopologySpread" (dict "ctx" . "component" "api") | nindent 6 }}
      {{- if .Values.api.leaderElection.enabled }}
      serviceAccountName: {{ include "constellation.fullname" . }}-api
      automountServiceAccountToken: true
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      containers:
        - name: api
          image: {{ include "constellation.roleImage" (dict "ctx" . "role" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "constellation.containerSecurityContext" . | nindent 10 }}
          {{- with .Values.api.args }}
          args: {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - { containerPort: 8080, name: http }
            # Admin listener: /metrics, /healthz, /readyz and pprof (when
            # enabled). Not exposed through the Ingress/Gateway.
            - { containerPort: 9090, name: admin }
          env:
            {{- if .Values.clusterRegistration.clusterId }}
            # Local cluster UUID binds trusted protection to this installation only.
            - name: CONSTELLATION_QUARANTINE_PROTECTED_NAMESPACES
              value: {{ dict .Values.clusterRegistration.clusterId (include "constellation.protectedNamespaces" (dict "ctx" .) | fromJsonArray) | toJson | quote }}
            {{- end }}
            - name: LISTEN_ADDR
              value: ":8080"
            - name: ADMIN_LISTEN_ADDR
              value: ":9090"
            - name: CONSTELLATION_AGE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "constellation.cryptoSecretName" . }}
                  key: age-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "constellation.dsnSecret" . }}
                  key: {{ include "constellation.dsnSecretKey" . }}
            - name: PARTITION_STATISTICS_MAINTENANCE_ENABLED
              value: {{ .Values.api.partitionStatisticsMaintenanceEnabled | quote }}
{{- if .Values.api.supportBundleSigningKeySecret }}
            - name: CONSTELLATION_SUPPORT_BUNDLE_SIGNING_KEY_FILE
              value: /var/run/constellation/support-bundle-signing-key/private-key.pem
{{- end }}
{{- if .Values.api.leaderElection.enabled }}
            - name: LEADER_ELECTION_ENABLED
              value: "true"
            - name: LEADER_ELECTION_ID
              value: {{ .Values.api.leaderElection.leaseName | default (printf "%s-api.alphabravo.io" (include "constellation.fullname" .)) | quote }}
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
{{- end }}
{{- if .Values.federation.masterUrl }}
            # FED-JOIN-25: joint-side federation config. When masterUrl is set this
            # controller is a joint: the background poller (ReconcileFedSyncLoop) pulls the
            # named master, and `constellationctl federation join` / POST /federation/join-remote
            # fall back to these when no master_url/token is passed. Leave masterUrl empty
            # (the default) for a standalone or master controller.
            - name: CONSTELLATION_FED_MASTER_URL
              value: {{ .Values.federation.masterUrl | quote }}
{{- if .Values.federation.joinTokenSecret }}
            - name: CONSTELLATION_FED_MASTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.federation.joinTokenSecret }}
                  key: {{ .Values.federation.joinTokenSecretKey | default "token" }}
                  optional: true
{{- else if .Values.federation.joinToken }}
            - name: CONSTELLATION_FED_MASTER_TOKEN
              value: {{ .Values.federation.joinToken | quote }}
{{- end }}
{{- end }}
            - name: CONSTELLATION_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "constellation.runtimeAgentTokenSecret" . }}
                  key: token
                  optional: true
            - name: RUNTIME_AGENT_TOKEN_FILE
              value: /var/run/constellation/runtime-agent-token/token
{{- if .Values.api.pcapStorage.enabled }}
            - name: CONSTELLATION_DATA_DIR
              value: /var/lib/constellation-pcap
{{- end }}
{{- if .Values.complianceScheduler.enabled }}
            - name: REPORT_OUT_DIR
              value: /var/lib/constellation-reports/reports
{{- end }}
            - name: CONSTELLATION_PCAP_RETENTION_ENABLED
              value: {{ ternary "true" "false" (and .Values.api.pcapStorage.enabled .Values.api.pcapStorage.retentionEnabled) | quote }}
{{- range $k, $v := .Values.api.env }}
{{- if and (ne $k "CONSTELLATION_PCAP_RETENTION_ENABLED") (not (and $.Values.complianceScheduler.enabled (eq $k "REPORT_OUT_DIR"))) (not (and $.Values.api.pcapStorage.enabled (eq $k "CONSTELLATION_DATA_DIR"))) }}
            - name: {{ $k }}
              value: "{{ $v }}"
{{- end }}
{{- end }}
            - name: LOCAL_AUTH_ENABLED
              value: {{ .Values.auth.local.enabled | quote }}
            - name: LOCAL_AUTH_DISPLAY
              value: {{ .Values.auth.local.display | quote }}
            - name: LOCAL_AUTH_TOTP_POLICY
              value: {{ .Values.auth.local.totpPolicy | quote }}
            - name: LOCAL_AUTH_PASSWORD_MIN_LENGTH
              value: {{ .Values.auth.local.passwordMinLength | quote }}
            - name: LOCAL_AUTH_SESSION_SECONDS
              value: {{ .Values.auth.local.sessionSeconds | quote }}
            - name: LOCAL_AUTH_IP_RATE
              value: {{ .Values.auth.local.ipRate | quote }}
            - name: LOCAL_AUTH_ACCOUNT_RATE
              value: {{ .Values.auth.local.accountRate | quote }}
            - name: LOCAL_AUTH_ORG
              value: {{ .Values.auth.local.orgName | quote }}
{{- if .Values.auth.local.bootstrap.enabled }}
            - name: LOCAL_BOOTSTRAP_EMAIL
              value: {{ .Values.auth.local.bootstrap.email | quote }}
            - name: LOCAL_BOOTSTRAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.local.bootstrap.existingSecret | default (printf "%s-local-admin" (include "constellation.fullname" .)) | quote }}
                  key: password
            - name: LOCAL_BOOTSTRAP_TOTP
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.local.bootstrap.existingSecret | default (printf "%s-local-admin" (include "constellation.fullname" .)) | quote }}
                  key: totp-secret
{{- end }}
{{- if .Values.auth.oidc.enabled }}
            - name: OIDC_ISSUER_URL
              value: {{ required "auth.oidc.issuerURL is required" .Values.auth.oidc.issuerURL | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ required "auth.oidc.clientID is required" .Values.auth.oidc.clientID | quote }}
            - name: OIDC_AUDIENCE
              value: {{ .Values.auth.oidc.audience | default .Values.auth.oidc.clientID | quote }}
            - name: OIDC_REDIRECT_URL
              value: {{ required "auth.oidc.redirectURL is required" .Values.auth.oidc.redirectURL | quote }}
            - name: OIDC_ROLES_CLAIM
              value: {{ .Values.auth.oidc.rolesClaim | quote }}
            - name: OIDC_ROLE_MAPPING
              value: {{ .Values.auth.oidc.roleMapping | toJson | quote }}
            - name: OIDC_SCOPES
              value: {{ join " " .Values.auth.oidc.scopes | quote }}
            - name: OIDC_ORG
              value: {{ .Values.auth.oidc.orgName | quote }}
{{- if .Values.auth.oidc.clientSecretName }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.oidc.clientSecretName | quote }}
                  key: client-secret
{{- end }}
{{- end }}
            - name: BREAK_GLASS_ENABLED
              value: {{ .Values.auth.breakGlass.enabled | quote }}
{{- if .Values.auth.breakGlass.enabled }}
            - name: BREAK_GLASS_ORG
              value: {{ .Values.auth.breakGlass.orgName | quote }}
            - name: BREAK_GLASS_SESSION_TTL
              value: {{ .Values.auth.breakGlass.sessionTTL | quote }}
            - name: BREAK_GLASS_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: {{ required "auth.breakGlass.existingSecret is required" .Values.auth.breakGlass.existingSecret | quote }}
                  key: password-hash
            - name: BREAK_GLASS_TOTP_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.breakGlass.existingSecret | quote }}
                  key: totp-secret
{{- end }}
            - name: CONSTELLATION_REPOSITORY_SCAN_RETENTION_ENABLED
              value: {{ .Values.repositoryScans.retention.enabled | quote }}
            - name: CONSTELLATION_REPOSITORY_SCAN_RETENTION_MAX_AGE
              value: {{ .Values.repositoryScans.retention.maxAge | quote }}
            - name: CONSTELLATION_REPOSITORY_SCAN_RETENTION_INTERVAL
              value: {{ .Values.repositoryScans.retention.interval | quote }}
            - name: CONSTELLATION_REPOSITORY_SCAN_RETENTION_BATCH_SIZE
              value: {{ .Values.repositoryScans.retention.batchSize | quote }}
            - name: CONSTELLATION_REPOSITORY_SCAN_RETENTION_DRY_RUN
              value: {{ .Values.repositoryScans.retention.dryRun | quote }}
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
{{- if .Values.complianceScheduler.enabled }}
            - name: compliance-reports
              mountPath: /var/lib/constellation-reports
              readOnly: true
{{- end }}
{{- if .Values.api.pcapStorage.enabled }}
            - name: pcap-evidence
              mountPath: /var/lib/constellation-pcap
{{- end }}
            - name: runtime-agent-token
              mountPath: /var/run/constellation/runtime-agent-token
              readOnly: true
{{- if .Values.api.supportBundleSigningKeySecret }}
            - name: support-bundle-signing-key
              mountPath: /var/run/constellation/support-bundle-signing-key
              readOnly: true
{{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
{{- if .Values.complianceScheduler.enabled }}
        - name: compliance-reports
          persistentVolumeClaim:
            claimName: {{ .Values.complianceScheduler.storage.existingClaim | quote }}
            readOnly: true
{{- end }}
{{- if .Values.api.pcapStorage.enabled }}
        - name: pcap-evidence
          persistentVolumeClaim:
            claimName: {{ .Values.api.pcapStorage.existingClaim | quote }}
{{- end }}
        - name: runtime-agent-token
          secret:
            secretName: {{ include "constellation.runtimeAgentTokenSecret" . }}
            optional: true
{{- if .Values.api.supportBundleSigningKeySecret }}
        - name: support-bundle-signing-key
          secret:
            secretName: {{ .Values.api.supportBundleSigningKeySecret | quote }}
            items:
              - key: {{ .Values.api.supportBundleSigningKeySecretKey | quote }}
                path: private-key.pem
{{- end }}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "constellation.fullname" . }}-api
  labels: {{- include "constellation.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "constellation.name" . }}
    app.kubernetes.io/component: api
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: 9090
      targetPort: admin
      protocol: TCP
      name: admin
{{- if (or .Values.api.metrics.serviceMonitor.enabled .Values.metrics.serviceMonitor.enabled) }}
---
# Prometheus Operator discovery of the admin listener. Requires the
# monitoring.coreos.com CRDs; gated so clusters without them still install.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "constellation.fullname" . }}-api
  namespace: {{ .Values.api.metrics.serviceMonitor.namespace | default .Release.Namespace }}
  labels: {{- include "constellation.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
    {{- with .Values.api.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "constellation.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  endpoints:
    - port: admin
      path: /metrics
      interval: {{ .Values.api.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.api.metrics.serviceMonitor.scrapeTimeout }}
{{- end }}
{{- if .Values.api.leaderElection.enabled }}
---
# D5: leader election RBAC. Only rendered when api.leaderElection.enabled — the
# api needs to read/write a coordination.k8s.io Lease in its own namespace to
# elect a single replica that runs the singleton background loops.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "constellation.fullname" . }}-api
  labels: {{- include "constellation.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "constellation.fullname" . }}-api-leader-election
  namespace: {{ .Release.Namespace }}
  labels: {{- include "constellation.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "constellation.fullname" . }}-api-leader-election
  namespace: {{ .Release.Namespace }}
  labels: {{- include "constellation.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "constellation.fullname" . }}-api-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "constellation.fullname" . }}-api
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
