{{- if .Values.api.enabled }}
{{- if and .Values.astronomer.enabled (not .Values.astronomer.jwksURL) }}
{{- fail "astronomer.jwksURL is required when astronomer.enabled=true" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "constellation.fullname" . }}-api
  labels: {{- include "constellation.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "constellation.name" . }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "constellation.name" . }}
        app.kubernetes.io/component: api
    spec:
      {{- include "constellation.pullSecrets" . | nindent 6 }}
      {{- include "constellation.podSecurityContext" . | nindent 6 }}
      {{- include "constellation.haTopologySpread" (dict "ctx" . "component" "api") | nindent 6 }}
      {{- if .Values.api.leaderElection.enabled }}
      serviceAccountName: {{ include "constellation.fullname" . }}-api
      automountServiceAccountToken: true
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      initContainers:
        - name: wait-for-migrations
          image: {{ .Values.migrate.psqlImage }}
          {{- include "constellation.helperContainerSecurityContext" . | nindent 10 }}
          command:
            - /bin/sh
            - -ec
            - |
              until psql "$DATABASE_URL" -Atc "select 1 from session_signing_keys limit 1" >/dev/null 2>&1; do
                echo "waiting for database migrations"
                sleep 2
              done
          env:
            - name: HOME
              value: /tmp
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "constellation.dsnSecret" . }}
                  key: {{ include "constellation.dsnSecretKey" . }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: api
          image: {{ include "constellation.roleImage" (dict "ctx" . "role" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "constellation.containerSecurityContext" . | nindent 10 }}
          {{- with .Values.api.args }}
          args: {{- toYaml . | nindent 12 }}
          {{- end }}
          ports: [{ containerPort: 8080, name: http }]
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "constellation.dsnSecret" . }}
                  key: {{ include "constellation.dsnSecretKey" . }}
{{- if .Values.api.jwtKeysSecret }}
            # A5: an operator-supplied JWT_KEYS overrides the default DB-backed RS256
            # session keypair. Only injected when api.jwtKeysSecret names a pre-existing
            # Secret; otherwise the api signs sessions RS256 with the shared keypair
            # persisted in session_signing_keys (see internal/auth/sessionkeys.go).
            - name: JWT_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ include "constellation.jwtKeysSecretName" . }}
                  key: keys
{{- end }}
            - name: CONSTELLATION_REQUIRE_JWT_KEYS
              value: {{ .Values.api.requireJWTKeys | quote }}
{{- if .Values.api.leaderElection.enabled }}
            - name: LEADER_ELECTION_ENABLED
              value: "true"
            - name: LEADER_ELECTION_ID
              value: {{ .Values.api.leaderElection.leaseName | default (printf "%s-api.alphabravo.io" (include "constellation.fullname" .)) | quote }}
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
{{- end }}
{{- if .Values.federation.masterUrl }}
            # FED-JOIN-25: joint-side federation config. When masterUrl is set this
            # controller is a joint: the background poller (ReconcileFedSyncLoop) pulls the
            # named master, and `constellationctl federation join` / POST /federation/join-remote
            # fall back to these when no master_url/token is passed. Leave masterUrl empty
            # (the default) for a standalone or master controller.
            - name: CONSTELLATION_FED_MASTER_URL
              value: {{ .Values.federation.masterUrl | quote }}
{{- if .Values.federation.joinTokenSecret }}
            - name: CONSTELLATION_FED_MASTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.federation.joinTokenSecret }}
                  key: {{ .Values.federation.joinTokenSecretKey | default "token" }}
                  optional: true
{{- else if .Values.federation.joinToken }}
            - name: CONSTELLATION_FED_MASTER_TOKEN
              value: {{ .Values.federation.joinToken | quote }}
{{- end }}
{{- end }}
            - name: CONSTELLATION_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "constellation.runtimeAgentTokenSecret" . }}
                  key: token
                  optional: true
            - name: RUNTIME_AGENT_TOKEN_FILE
              value: /var/run/constellation/runtime-agent-token/token
{{- range $k, $v := .Values.api.env }}
            - name: {{ $k }}
              value: "{{ $v }}"
{{- end }}
{{- if .Values.astronomer.enabled }}
            - name: ASTRONOMER_JWKS_URL
              value: "{{ .Values.astronomer.jwksURL }}"
{{- if .Values.astronomer.jwtIssuer }}
            - name: ASTRONOMER_JWT_ISSUER
              value: "{{ .Values.astronomer.jwtIssuer }}"
{{- end }}
{{- if .Values.astronomer.jwtAudience }}
            - name: ASTRONOMER_JWT_AUDIENCE
              value: "{{ .Values.astronomer.jwtAudience }}"
{{- end }}
{{- end }}
            # Slice D.2: path to the constellation-vulndb bbolt store
            # used by the host-package CVE matcher and VulnDB import path.
            # The chart mounts this from the configured shared VulnDB volume.
            - name: CONSTELLATION_VULNDB_PATH
              value: {{ include "constellation.vulndbPath" . | quote }}
            - name: CONSTELLATION_VULNDB_STATUS_PATH
              value: {{ printf "%s/%s" .Values.vulndb.mountPath .Values.vulndb.statusFile | quote }}
            - name: CONSTELLATION_VULNDB_MANUAL_UPLOAD_ENABLED
              value: {{ .Values.vulndb.manualUpload.enabled | quote }}
            - name: CONSTELLATION_VULNDB_READY_REQUIRED
              value: {{ .Values.vulndb.readiness.requireBundle | quote }}
{{- if .Values.vulndb.readiness.maxAge }}
            - name: CONSTELLATION_VULNDB_READY_MAX_AGE
              value: {{ .Values.vulndb.readiness.maxAge | quote }}
{{- end }}
            - name: CONSTELLATION_VULNDB_RESCAN_INTERVAL
              value: {{ .Values.vulndb.rescan.interval | quote }}
            - name: CONSTELLATION_REPOSITORY_SCAN_RETENTION_ENABLED
              value: {{ .Values.repositoryScans.retention.enabled | quote }}
            - name: CONSTELLATION_REPOSITORY_SCAN_RETENTION_MAX_AGE
              value: {{ .Values.repositoryScans.retention.maxAge | quote }}
            - name: CONSTELLATION_REPOSITORY_SCAN_RETENTION_INTERVAL
              value: {{ .Values.repositoryScans.retention.interval | quote }}
            - name: CONSTELLATION_REPOSITORY_SCAN_RETENTION_BATCH_SIZE
              value: {{ .Values.repositoryScans.retention.batchSize | quote }}
            - name: CONSTELLATION_REPOSITORY_SCAN_RETENTION_DRY_RUN
              value: {{ .Values.repositoryScans.retention.dryRun | quote }}
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: vulndb
              mountPath: {{ .Values.vulndb.mountPath | quote }}
              readOnly: {{ not .Values.vulndb.manualUpload.enabled }}
            - name: runtime-agent-token
              mountPath: /var/run/constellation/runtime-agent-token
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- include "constellation.vulndbVolume" . | nindent 8 }}
        - name: runtime-agent-token
          secret:
            secretName: {{ include "constellation.runtimeAgentTokenSecret" . }}
            optional: true
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "constellation.fullname" . }}-api
  labels: {{- include "constellation.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "constellation.name" . }}
    app.kubernetes.io/component: api
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
{{- if .Values.api.leaderElection.enabled }}
---
# D5: leader election RBAC. Only rendered when api.leaderElection.enabled — the
# api needs to read/write a coordination.k8s.io Lease in its own namespace to
# elect a single replica that runs the singleton background loops.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "constellation.fullname" . }}-api
  labels: {{- include "constellation.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "constellation.fullname" . }}-api-leader-election
  namespace: {{ .Release.Namespace }}
  labels: {{- include "constellation.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "constellation.fullname" . }}-api-leader-election
  namespace: {{ .Release.Namespace }}
  labels: {{- include "constellation.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "constellation.fullname" . }}-api-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "constellation.fullname" . }}-api
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
