{{- if .Values.kubeBenchRunner.enabled }}
{{- $clusterName := default (default .Release.Namespace .Values.clusterRegistration.name) .Values.kubeBenchRunner.clusterName -}}
{{- $image := .Values.kubeBenchRunner.image.repository -}}
{{- if not $image }}{{- fail "kubeBenchRunner.enabled requires kubeBenchRunner.image.repository (the image must contain both the kube-bench-runner binary and the upstream kube-bench binary)" }}{{- end }}
{{- $tag := default (include "constellation.imageTag" .) .Values.kubeBenchRunner.image.tag -}}
{{- $image = printf "%s:%s" $image $tag -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "constellation.fullname" . }}-kube-bench
  labels: {{- include "constellation.labels" . | nindent 4 }}
    app.kubernetes.io/component: kube-bench-runner
spec:
  schedule: {{ .Values.kubeBenchRunner.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "constellation.name" . }}
            app.kubernetes.io/component: kube-bench-runner
        spec:
          {{- include "constellation.pullSecrets" . | nindent 10 }}
          {{- include "constellation.podSecurityContext" . | nindent 10 }}
          # kube-bench inspects host file permissions and process flags, so it
          # runs on the host PID namespace and mounts host paths read-only.
          hostPID: true
          restartPolicy: OnFailure
          containers:
            - name: runner
              image: {{ $image }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["/usr/local/bin/constellation-kube-bench-runner"]
              env:
                - name: CONSTELLATION_API_URL
                  value: {{ include "constellation.apiURL" . | quote }}
                - name: BENCH_PROFILE
                  value: {{ .Values.kubeBenchRunner.profile | quote }}
                - name: BENCH_BINARY
                  value: {{ .Values.kubeBenchRunner.binary | quote }}
                - name: BENCH_ARGS
                  value: {{ .Values.kubeBenchRunner.args | quote }}
                - name: CONSTELLATION_CLUSTER_NAME
                  value: {{ $clusterName | quote }}
                {{- if .Values.kubeBenchRunner.clusterId }}
                - name: CONSTELLATION_CLUSTER_ID
                  value: {{ .Values.kubeBenchRunner.clusterId | quote }}
                {{- else if .Values.clusterRegistration.clusterId }}
                - name: CONSTELLATION_CLUSTER_ID
                  value: {{ .Values.clusterRegistration.clusterId | quote }}
                {{- end }}
                - name: CONSTELLATION_KUBE_BENCH_RUNNER_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "constellation.runtimeAgentTokenSecret" . }}
                      key: token
                      optional: true
                - name: RUNTIME_AGENT_TOKEN_FILE
                  value: /var/run/constellation/runtime-agent-token/token
              volumeMounts:
                - name: runtime-agent-token
                  mountPath: /var/run/constellation/runtime-agent-token
                  readOnly: true
                {{- with .Values.kubeBenchRunner.hostVolumeMounts }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              resources: {{- toYaml .Values.kubeBenchRunner.resources | nindent 16 }}
          volumes:
            - name: runtime-agent-token
              secret:
                secretName: {{ include "constellation.runtimeAgentTokenSecret" . }}
                optional: true
            {{- with .Values.kubeBenchRunner.hostVolumes }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
{{- end }}
