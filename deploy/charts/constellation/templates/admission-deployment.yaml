{{- if .Values.admission.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "constellation.fullname" . }}-admission
  labels: {{- include "constellation.labels" . | nindent 4 }}
    app.kubernetes.io/component: admission
spec:
  replicas: {{ .Values.admission.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "constellation.name" . }}
      app.kubernetes.io/component: admission
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "constellation.name" . }}
        app.kubernetes.io/component: admission
    spec:
      {{- include "constellation.pullSecrets" . | nindent 6 }}
      {{- include "constellation.podSecurityContext" . | nindent 6 }}
      automountServiceAccountToken: false
      containers:
        - name: admission
          image: {{ include "constellation.roleImage" (dict "ctx" . "role" "admission") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "constellation.containerSecurityContext" . | nindent 10 }}
          args:
            - "--listen=:8443"
            - "--tls-cert=/etc/constellation/tls/tls.crt"
            - "--tls-key=/etc/constellation/tls/tls.key"
            {{- if and .Values.admission.quarantine.enabled .Values.admission.quarantine.clusterId }}
            - "--quarantine-cluster-id={{ .Values.admission.quarantine.clusterId }}"
            - "--quarantine-refresh={{ .Values.admission.quarantine.refresh }}"
            - "--quarantine-max-stale={{ .Values.admission.quarantine.maxStale }}"
            {{- end }}
            {{- if .Values.admission.policies.enabled }}
            {{- $policyClusterID := default .Values.admission.quarantine.clusterId .Values.admission.policies.clusterId }}
            {{- if $policyClusterID }}
            - "--policy-cluster-id={{ $policyClusterID }}"
            {{- end }}
            - "--policy-refresh={{ .Values.admission.policies.refresh }}"
            {{- end }}
            {{- if .Values.admission.audit.enabled }}
            {{- $auditDefaultClusterID := default .Values.admission.quarantine.clusterId .Values.admission.policies.clusterId }}
            {{- $auditClusterID := default $auditDefaultClusterID .Values.admission.audit.clusterId }}
            {{- if $auditClusterID }}
            - "--audit-cluster-id={{ $auditClusterID }}"
            {{- end }}
            {{- end }}
            {{- with .Values.admission.args }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: CONSTELLATION_API_URL
              value: {{ include "constellation.apiURL" . | quote }}
            - name: CONSTELLATION_CLUSTER_NAME
              value: {{ include "constellation.clusterName" . | quote }}
            {{- if .Values.clusterRegistration.clusterId }}
            - name: CONSTELLATION_CLUSTER_ID
              value: {{ .Values.clusterRegistration.clusterId | quote }}
            {{- end }}
            - name: CONSTELLATION_ADMISSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "constellation.runtimeAgentTokenSecret" . }}
                  key: token
                  optional: true
            - name: RUNTIME_AGENT_TOKEN_FILE
              value: /var/run/constellation/runtime-agent-token/token
            {{- if .Values.admission.policies.enabled }}
            - name: CONSTELLATION_ADMISSION_POLICY_DSN
              {{- if .Values.admission.policies.dsn }}
              value: {{ .Values.admission.policies.dsn | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "constellation.dsnSecret" . }}
                  key: {{ include "constellation.dsnSecretKey" . }}
              {{- end }}
            {{- end }}
            {{- if .Values.admission.audit.enabled }}
            - name: CONSTELLATION_ADMISSION_AUDIT_DSN
              {{- if .Values.admission.audit.dsn }}
              value: {{ .Values.admission.audit.dsn | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "constellation.dsnSecret" . }}
                  key: {{ include "constellation.dsnSecretKey" . }}
              {{- end }}
            {{- end }}
            {{- if and .Values.admission.quarantine.enabled .Values.admission.quarantine.clusterId }}
            - name: CONSTELLATION_QUARANTINE_DSN
              {{- if .Values.admission.quarantine.dsn }}
              value: {{ .Values.admission.quarantine.dsn | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "constellation.dsnSecret" . }}
                  key: {{ include "constellation.dsnSecretKey" . }}
              {{- end }}
            {{- end }}
          ports:
            - containerPort: 8443
              name: webhook
          volumeMounts:
            - name: tls
              mountPath: /etc/constellation/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: runtime-agent-token
              mountPath: /var/run/constellation/runtime-agent-token
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: webhook
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: webhook
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
          resources: {{- toYaml .Values.admission.resources | nindent 12 }}
      volumes:
        - name: tls
          secret:
            secretName: {{ include "constellation.admissionTLSSecret" . }}
            optional: false
        - name: tmp
          emptyDir: {}
        - name: runtime-agent-token
          secret:
            secretName: {{ include "constellation.runtimeAgentTokenSecret" . }}
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "constellation.fullname" . }}-admission
  labels: {{- include "constellation.labels" . | nindent 4 }}
    app.kubernetes.io/component: admission
spec:
  type: {{ .Values.admission.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "constellation.name" . }}
    app.kubernetes.io/component: admission
  ports:
    - name: https
      port: {{ .Values.admission.service.port }}
      targetPort: {{ .Values.admission.service.targetPort }}
      protocol: TCP
{{- end }}
