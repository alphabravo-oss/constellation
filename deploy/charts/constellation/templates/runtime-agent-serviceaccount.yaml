{{- if .Values.runtimeAgent.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "constellation.fullname" . }}-runtime-agent
  labels: {{- include "constellation.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "constellation.fullname" . }}-{{ .Release.Namespace }}-session-protection
  labels: {{- include "constellation.labels" . | nindent 4 }}
rules:
  # Fresh identity and protected endpoint checks before destructive session actions.
  - apiGroups: [""]
    resources: ["pods", "services", "nodes"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "constellation.fullname" . }}-{{ .Release.Namespace }}-session-protection
  labels: {{- include "constellation.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "constellation.fullname" . }}-runtime-agent
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "constellation.fullname" . }}-{{ .Release.Namespace }}-session-protection
{{- end }}
