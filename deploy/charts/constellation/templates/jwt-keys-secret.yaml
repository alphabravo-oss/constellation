{{- /*
A5: the chart no longer renders a symmetric HS256 JWT_KEYS Secret. With no
operator-supplied api.jwtKeysSecret, the api signs sessions RS256 using the
shared keypair it generates + persists in the session_signing_keys table on
first boot (internal/auth/sessionkeys.go), so every replica shares one key and
a rotation keeps prior tokens valid until they expire.

To override with your own key, set api.jwtKeysSecret to a pre-existing Secret
whose `keys` entry is either a PEM RSA/EC private key (RS256/ES256) or, only
when CONSTELLATION_ALLOW_HS256_JWT=true is set on the api, a 32+ byte HS256
secret.
*/ -}}
