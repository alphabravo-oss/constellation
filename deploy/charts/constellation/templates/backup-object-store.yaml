{{- if .Values.backup.objectStore.enabled -}}
{{- /*
In-cluster S3-compatible object store for CNPG Barman Cloud backups.
Replaces the hand-applied manifests formerly in deploy/dev/cnpg-rustfs/.

Renders, in this order:
  1. credentials Secret (unless backup.objectStore.credentialsSecret is set) —
     random keys, re-used on upgrade via lookup, resource-policy keep.
  2. RustFS Service + single-replica StatefulSet with one PVC.
  3. barmancloud.cnpg.io/v1 ObjectStore CR that the CNPG Cluster plugin
     references (constellation.barmanObjectStoreName).
  4. revision-scoped bucket-creation Job (aws-cli) that waits for RustFS and
     creates the bucket idempotently.

Single replica, same cluster: this is a convenient WAL archive, not an off-host
disaster-recovery target (docs/cnpg-recovery.md).
*/ -}}
{{- $os := .Values.backup.objectStore -}}
{{- $name := include "constellation.objectStoreName" . -}}
{{- $secret := include "constellation.objectStoreCredentialsSecret" . -}}
{{- $endpoint := printf "http://%s:9000" $name -}}
{{- if not $os.credentialsSecret -}}
{{- $access := "" -}}
{{- $secretKey := "" -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secret -}}
{{- if and $existing $existing.data (index $existing.data "ACCESS_KEY_ID") (index $existing.data "SECRET_ACCESS_KEY") -}}
  {{- $access = index $existing.data "ACCESS_KEY_ID" | b64dec -}}
  {{- $secretKey = index $existing.data "SECRET_ACCESS_KEY" | b64dec -}}
{{- else -}}
  {{- $access = randAlphaNum 20 -}}
  {{- $secretKey = randAlphaNum 40 -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # Rotating the keys would orphan the archive; keep the Secret on uninstall.
    "helm.sh/resource-policy": keep
  labels: {{- include "constellation.labels" . | nindent 4 }}
    app.kubernetes.io/component: object-store
type: Opaque
stringData:
  ACCESS_KEY_ID: {{ $access | quote }}
  SECRET_ACCESS_KEY: {{ $secretKey | quote }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "constellation.labels" . | nindent 4 }}
    app.kubernetes.io/component: object-store
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "constellation.name" . }}
    app.kubernetes.io/component: object-store
  ports:
    - name: s3
      port: 9000
      targetPort: s3
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "constellation.labels" . | nindent 4 }}
    app.kubernetes.io/component: object-store
spec:
  serviceName: {{ $name }}
  replicas: 1
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "constellation.name" . }}
      app.kubernetes.io/component: object-store
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "constellation.name" . }}
        app.kubernetes.io/component: object-store
    spec:
      {{- include "constellation.pullSecrets" . | nindent 6 }}
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rustfs
          image: {{ $os.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["/data"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: ACCESS_KEY_ID } }
            - name: RUSTFS_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: SECRET_ACCESS_KEY } }
            - name: RUSTFS_ADDRESS
              value: ":9000"
            - name: RUSTFS_CONSOLE_ENABLE
              value: "false"
            - name: RUSTFS_OBS_LOGGER_LEVEL
              value: "warn"
            - name: RUSTFS_OBS_LOG_DIRECTORY
              value: /tmp/rustfs-logs
          ports:
            - name: s3
              containerPort: 9000
          readinessProbe:
            httpGet: { path: /health, port: s3 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: s3 }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources: {{- toYaml $os.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if $os.storageClass }}
        storageClassName: {{ $os.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ $os.storage }}
---
# Barman Cloud plugin archive definition. The CNPG Cluster references it by
# name (plugins[].parameters.barmanObjectName) when barmanCloud.enabled=true.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: {{ include "constellation.objectStoreArchiveName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "constellation.labels" . | nindent 4 }}
    app.kubernetes.io/component: object-store
spec:
  retentionPolicy: {{ $os.retentionPolicy | quote }}
  configuration:
    destinationPath: s3://{{ $os.bucket }}/
    endpointURL: {{ $endpoint | quote }}
    s3Credentials:
      accessKeyId: { name: {{ $secret }}, key: ACCESS_KEY_ID }
      secretAccessKey: { name: {{ $secret }}, key: SECRET_ACCESS_KEY }
    wal: { compression: gzip, maxParallel: 2 }
    data: { compression: gzip, jobs: 2 }
  instanceSidecarConfiguration:
    env:
      - name: AWS_DEFAULT_REGION
        value: {{ $os.region | quote }}
---
# One-shot bucket creation. Revision-scoped like the bootstrap Job so a
# `helm upgrade` re-runs it (idempotent: head-bucket short-circuits).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-bucket-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "constellation.labels" . | nindent 4 }}
    app.kubernetes.io/component: object-store-bucket
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "constellation.name" . }}
        app.kubernetes.io/component: object-store-bucket
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      {{- include "constellation.pullSecrets" . | nindent 6 }}
      {{- include "constellation.helperPodSecurityContext" . | nindent 6 }}
      containers:
        - name: create-bucket
          image: {{ $os.bucketJobImage | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "constellation.helperContainerSecurityContext" . | nindent 10 }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              for i in $(seq 1 60); do
                if aws --endpoint-url "$ENDPOINT" s3api head-bucket --bucket "$BUCKET" >/dev/null 2>&1; then echo "bucket $BUCKET present"; exit 0; fi
                if aws --endpoint-url "$ENDPOINT" s3api create-bucket --bucket "$BUCKET" >/dev/null 2>&1; then echo "bucket $BUCKET created"; exit 0; fi
                sleep 5
              done
              echo "object store at $ENDPOINT did not accept bucket $BUCKET in 300s" >&2; exit 1
          env:
            - name: HOME
              value: /tmp
            - name: ENDPOINT
              value: {{ $endpoint | quote }}
            - name: BUCKET
              value: {{ $os.bucket | quote }}
            - name: AWS_DEFAULT_REGION
              value: {{ $os.region | quote }}
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: ACCESS_KEY_ID } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: SECRET_ACCESS_KEY } }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            limits:   { cpu: 200m, memory: 128Mi }
            requests: { cpu: 20m,  memory: 32Mi }
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
