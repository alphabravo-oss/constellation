{{- if .Values.discoverer.enabled }}
{{- $clusterName := default (default .Release.Namespace .Values.clusterRegistration.name) .Values.discoverer.clusterName -}}
{{- $orgID := default .Values.clusterRegistration.orgID .Values.discoverer.orgID -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "constellation.fullname" . }}-discoverer
  labels: {{- include "constellation.labels" . | nindent 4 }}
    app.kubernetes.io/component: discoverer
spec:
  replicas: {{ .Values.discoverer.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "constellation.name" . }}
      app.kubernetes.io/component: discoverer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "constellation.name" . }}
        app.kubernetes.io/component: discoverer
    spec:
      {{- include "constellation.pullSecrets" . | nindent 6 }}
      {{- include "constellation.podSecurityContext" . | nindent 6 }}
      serviceAccountName: {{ include "constellation.fullname" . }}-discoverer
      containers:
        - name: discoverer
          image: {{ include "constellation.roleImage" (dict "ctx" . "role" "discoverer") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "constellation.containerSecurityContext" . | nindent 10 }}
          {{- with .Values.discoverer.args }}
          args: {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "constellation.dsnSecret" . }}
                  key: {{ include "constellation.dsnSecretKey" . }}
            - name: CLUSTER_NAME
              value: {{ $clusterName | quote }}
            {{- if $orgID }}
            - name: ORG_ID
              value: {{ $orgID | quote }}
            {{- end }}
            - name: NAMESPACE_FILTER
              value: {{ .Values.discoverer.namespaceFilter | quote }}
            - name: RECONCILE_INTERVAL
              value: {{ .Values.discoverer.reconcileInterval | quote }}
            - name: CONSTELLATION_API_URL
              value: {{ include "constellation.apiURL" . | quote }}
            {{- if .Values.clusterRegistration.clusterId }}
            - name: CONSTELLATION_CLUSTER_ID
              value: {{ .Values.clusterRegistration.clusterId | quote }}
            {{- end }}
            - name: CONSTELLATION_CLUSTER_NAME
              value: {{ $clusterName | quote }}
            - name: CONSTELLATION_DISCOVERER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "constellation.runtimeAgentTokenSecret" . }}
                  key: token
                  optional: true
            - name: RUNTIME_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "constellation.runtimeAgentTokenSecret" . }}
                  key: token
                  optional: true
            - name: RUNTIME_AGENT_TOKEN_FILE
              value: /var/run/constellation/runtime-agent-token/token
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: runtime-agent-token
              mountPath: /var/run/constellation/runtime-agent-token
              readOnly: true
          resources: {{- toYaml .Values.discoverer.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: runtime-agent-token
          secret:
            secretName: {{ include "constellation.runtimeAgentTokenSecret" . }}
            optional: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "constellation.fullname" . }}-discoverer
  labels: {{- include "constellation.labels" . | nindent 4 }}
    app.kubernetes.io/component: discoverer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "constellation.fullname" . }}-discoverer
  labels: {{- include "constellation.labels" . | nindent 4 }}
    app.kubernetes.io/component: discoverer
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "nodes"]
    # watch: the discoverer runs a pod SharedInformer for real-time pod_ips
    # capture (network-flow identity), in addition to the periodic list.
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list"]
  - nonResourceURLs: ["/version"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "constellation.fullname" . }}-discoverer
  labels: {{- include "constellation.labels" . | nindent 4 }}
    app.kubernetes.io/component: discoverer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "constellation.fullname" . }}-discoverer
subjects:
  - kind: ServiceAccount
    name: {{ include "constellation.fullname" . }}-discoverer
    namespace: {{ .Release.Namespace }}
{{- end }}
