{{- if and .Values.admission.enabled .Values.admission.webhook.enabled }}
{{- /*
ValidatingWebhookConfiguration. The caBundle is populated by:
  - the cert-manager Certificate's `cert-manager.io/inject-ca-from` annotation, OR
  - the tls-bootstrap Job (default).
Preserve existing trust during upgrades, including upgrades with hooks disabled.
On first install the certificate controller or bootstrap Job still supplies it.
*/ -}}
{{- $caBundle := "" -}}
{{- $existing := lookup "admissionregistration.k8s.io/v1" "ValidatingWebhookConfiguration" "" (printf "%s-admission" (include "constellation.fullname" .)) -}}
{{- range $existing.webhooks -}}
{{- if eq .name "pods.constellation.alphabravo.io" -}}
{{- $caBundle = default "" .clientConfig.caBundle -}}
{{- end -}}
{{- end -}}
{{- if not $caBundle -}}
{{- $secret := lookup "v1" "Secret" .Release.Namespace (include "constellation.admissionTLSSecret" .) -}}
{{- $caBundle = default "" (index (default dict $secret.data) "ca.crt") -}}
{{- end -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "constellation.fullname" . }}-admission
  labels: {{- include "constellation.labels" . | nindent 4 }}
    app.kubernetes.io/component: admission
  {{- if .Values.tls.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "constellation.fullname" . }}-admission
  {{- end }}
webhooks:
  - name: pods.constellation.alphabravo.io
    admissionReviewVersions: ["v1"]
    sideEffects: {{ .Values.admission.webhook.sideEffects }}
    failurePolicy: {{ .Values.admission.webhook.failurePolicy }}
    timeoutSeconds: {{ .Values.admission.webhook.timeoutSeconds }}
    # Mandatory own/core namespace exclusions plus trusted dependency additions.
    # User selectors are ANDed with this exclusion and cannot remove it.
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: {{ include "constellation.protectedNamespaces" (dict "ctx" .) }}
        {{- with .Values.admission.webhook.namespaceSelector.matchExpressions }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.admission.webhook.namespaceSelector.matchLabels }}
      matchLabels: {{- toYaml . | nindent 8 }}
      {{- end }}
    clientConfig:
      service:
        name: {{ include "constellation.fullname" . }}-admission
        namespace: {{ .Release.Namespace }}
        path: /validate
        port: {{ .Values.admission.service.port }}
      caBundle: {{ $caBundle | quote }}
    rules: {{- toYaml .Values.admission.webhook.rules | nindent 6 }}
{{- end }}
