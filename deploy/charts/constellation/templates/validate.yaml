{{- if and .Values.highAvailability.enabled (lt (int .Values.api.replicas) 2) }}
{{- fail "highAvailability.enabled=true requires api.replicas>=2" }}
{{- end }}
{{- if and .Values.highAvailability.enabled .Values.api.enabled (gt (int .Values.api.replicas) 1) (not .Values.api.leaderElection.enabled) }}
{{- fail "HA API replicas require api.leaderElection.enabled=true" }}
{{- end }}
{{- if and .Values.highAvailability.enabled .Values.operator.enabled (gt (int .Values.operator.replicas) 1) (not .Values.operator.leaderElection.enabled) }}
{{- fail "HA operator replicas require operator.leaderElection.enabled=true" }}
{{- end }}
{{- if and .Values.highAvailability.enabled (eq (include "constellation.postgresMode" .) "statefulset") }}
{{- fail "highAvailability.enabled=true requires postgres.mode=cnpg or postgres.mode=external; embedded statefulset is single-instance" }}
{{- end }}
{{- if and .Values.highAvailability.enabled (eq (include "constellation.postgresMode" .) "cnpg") (lt (int .Values.postgres.cloudnativepg.instances) 3) }}
{{- fail "HA CloudNativePG requires postgres.cloudnativepg.instances>=3" }}
{{- end }}
{{- if and .Values.gateway.enabled .Values.ingress.enabled }}
{{- fail "enable only one of gateway.enabled or ingress.enabled" }}
{{- end }}
{{- $cnpg := .Values.postgres.cloudnativepg }}
{{- if .Values.postgres.retainStatefulSetForRollback }}
{{- if ne (include "constellation.postgresMode" .) "external" }}
{{- fail "retainStatefulSetForRollback requires postgres.mode=external" }}
{{- end }}
{{- $_ := required "retainStatefulSetForRollback requires postgres.existingSecret for the validated target" .Values.postgres.existingSecret }}
{{- end }}
{{- $barman := $cnpg.barmanCloud }}
{{- if or $barman.enabled $barman.recovery.enabled }}
{{- if ne (include "constellation.postgresMode" .) "cnpg" }}
{{- fail "Barman Cloud configuration requires postgres.mode=cnpg" }}
{{- end }}
{{- if $cnpg.backup }}
{{- fail "configure Barman Cloud plugin or legacy postgres.cloudnativepg.backup, not both" }}
{{- end }}
{{- $_ := required "Barman Cloud pluginName is required" $barman.pluginName }}
{{- end }}
{{- if $barman.enabled }}
{{- $_ := required "Barman Cloud objectStoreName is required" $barman.objectStoreName }}
{{- end }}
{{- if $barman.recovery.enabled }}
{{- $_ := required "Barman Cloud recovery sourceName is required" $barman.recovery.sourceName }}
{{- $_ := required "Barman Cloud recovery objectStoreName is required" $barman.recovery.objectStoreName }}
{{- $_ := required "Barman Cloud recovery serverName is required" $barman.recovery.serverName }}
{{- if and $barman.enabled (eq $barman.objectStoreName $barman.recovery.objectStoreName) (eq $barman.recovery.serverName (printf "%s-postgres" (include "constellation.fullname" .))) }}
{{- fail "recovery source must differ from the destination archive identity" }}
{{- end }}
{{- end }}

{{- if and .Values.api.enabled .Values.api.pcapStorage.enabled }}
{{- $storage := .Values.api.pcapStorage }}
{{- $claimName := required "api.pcapStorage.enabled requires an existing durable PVC (api.pcapStorage.existingClaim)" $storage.existingClaim }}
{{- if and (eq $storage.accessMode "ReadWriteOnce") (ne (int .Values.api.replicas) 1) }}
{{- fail "ReadWriteOnce PCAP storage requires exactly one API replica; use shared ReadWriteMany storage for multiple replicas" }}
{{- end }}
{{- if hasKey .Values.api.env "CONSTELLATION_DATA_DIR" }}
{{- if ne (trim (toString (index .Values.api.env "CONSTELLATION_DATA_DIR"))) "/var/lib/constellation-pcap" }}
{{- fail "api.env.CONSTELLATION_DATA_DIR conflicts with the durable PCAP mount /var/lib/constellation-pcap" }}
{{- end }}
{{- end }}
{{/* Offline rendering cannot inspect a claim. Live install/upgrade validates an
     existing claim; deployment preflight must also verify Bound/accessModes. */}}
{{- $claim := lookup "v1" "PersistentVolumeClaim" .Release.Namespace $claimName }}
{{- if $claim }}
{{- if ne (dig "status" "phase" "" $claim) "Bound" }}
{{- fail "PCAP storage PVC must be Bound before enabling API packet evidence" }}
{{- end }}
{{- if not (has $storage.accessMode $claim.spec.accessModes) }}
{{- fail "PCAP storage PVC accessModes do not match api.pcapStorage.accessMode" }}
{{- end }}
{{- end }}
{{- end }}
