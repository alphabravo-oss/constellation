{{- /*
Daily age-encrypted backup of the Kubernetes Secrets that live in no database
(TLS material, tokens, credentials). Runs on the purpose-built toolbox image
(age + kubectl + rclone, non-root) — no package manager at runtime. The archive
is encrypted to backup.secrets.ageRecipient; keep the matching identity OFF the
cluster. Restore: `age -d -i identity.txt secrets-<ts>.tar.gz.age | tar xz`.
*/ -}}
{{- $sb := .Values.backup.secrets -}}
{{- if $sb.enabled -}}
{{- $_ := required "backup.secrets.ageRecipient is required (age1...)" $sb.ageRecipient -}}
{{- $_ := required "backup.secrets.remote.endpointURL is required" $sb.remote.endpointURL -}}
{{- $_ := required "backup.secrets.remote.credentialsSecret is required" $sb.remote.credentialsSecret -}}
{{- $name := printf "%s-secrets-backup" (include "constellation.fullname" .) -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "constellation.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "constellation.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "constellation.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "constellation.labels" . | nindent 4 }}
data:
  backup.sh: |
    #!/bin/sh
    set -eu
    TS=$(date -u +%Y%m%dT%H%M%SZ); W=/work/$TS; mkdir -p "$W"
    for ns in $NAMESPACES; do
      kubectl -n "$ns" get secrets --field-selector type!=helm.sh/release.v1 -o yaml > "$W/$ns.secrets.yaml"
      echo "$ns: $(grep -c '^- apiVersion: v1' "$W/$ns.secrets.yaml") secrets"
    done
    OUT=/work/secrets-$TS.tar.gz.age
    tar -C /work -cf - "$TS" | gzip -9 | age -r "$AGE_RECIPIENT" -o "$OUT"
    rm -rf "$W"
    rclone copyto "$OUT" "offhost:$BUCKET/secrets/$(basename "$OUT")"
    rclone delete "offhost:$BUCKET/secrets" --min-age "${RETENTION_DAYS}d"
    echo "uploaded $(basename "$OUT") ($(stat -c %s "$OUT") bytes); retained:"; rclone ls "offhost:$BUCKET/secrets" | tail -n 5
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "constellation.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets-backup
spec:
  schedule: {{ $sb.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 172800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "constellation.name" . }}
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: secrets-backup
        spec:
          serviceAccountName: {{ $name }}
          restartPolicy: Never
          {{- include "constellation.pullSecrets" . | nindent 10 }}
          {{- include "constellation.podSecurityContext" . | nindent 10 }}
          containers:
            - name: backup
              image: {{ include "constellation.roleImage" (dict "ctx" . "role" "toolbox") }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              {{- include "constellation.containerSecurityContext" . | nindent 14 }}
              command: ["/bin/sh", "/opt/backup/backup.sh"]
              env:
                - { name: HOME, value: /tmp }
                - { name: AGE_RECIPIENT, value: {{ $sb.ageRecipient | quote }} }
                - { name: NAMESPACES, value: {{ (default (list .Release.Namespace) $sb.namespaces) | join " " | quote }} }
                - { name: BUCKET, value: {{ $sb.remote.bucket | quote }} }
                - { name: RETENTION_DAYS, value: {{ $sb.retentionDays | quote }} }
                - { name: RCLONE_CONFIG, value: /tmp/rclone.conf }
                - { name: RCLONE_CONFIG_OFFHOST_TYPE, value: s3 }
                - { name: RCLONE_CONFIG_OFFHOST_PROVIDER, value: Other }
                - { name: RCLONE_CONFIG_OFFHOST_ENDPOINT, value: {{ $sb.remote.endpointURL | quote }} }
                - { name: RCLONE_CONFIG_OFFHOST_REGION, value: {{ $sb.remote.region | quote }} }
                - { name: RCLONE_CONFIG_OFFHOST_FORCE_PATH_STYLE, value: "true" }
                - name: RCLONE_CONFIG_OFFHOST_ACCESS_KEY_ID
                  valueFrom: { secretKeyRef: { name: {{ $sb.remote.credentialsSecret }}, key: ACCESS_KEY_ID } }
                - name: RCLONE_CONFIG_OFFHOST_SECRET_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: {{ $sb.remote.credentialsSecret }}, key: SECRET_ACCESS_KEY } }
              resources: {{- toYaml $sb.resources | nindent 16 }}
              volumeMounts:
                - { name: script, mountPath: /opt/backup, readOnly: true }
                - { name: work, mountPath: /work }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: script
              configMap: { name: {{ $name }} }
            - name: work
              emptyDir: { sizeLimit: 256Mi }
            - name: tmp
              emptyDir: {}
{{- end }}
