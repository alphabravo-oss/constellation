{{- if .Values.admission.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "constellation.fullname" . }}-admission
  namespace: {{ .Release.Namespace }}
  labels: {{- include "constellation.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "constellation.fullname" . }}-admission-{{ .Release.Namespace }}
rules:
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get"]
  # Existing namespace-selector and ServiceAccount-role policy resolvers.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "constellation.fullname" . }}-admission-{{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "constellation.fullname" . }}-admission-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ include "constellation.fullname" . }}-admission
    namespace: {{ .Release.Namespace }}
{{- end }}
