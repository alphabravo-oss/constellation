{{- if .Values.gateway.enabled }}
{{- if not .Values.frontend.enabled }}
{{- fail "gateway.enabled=true requires frontend.enabled=true" }}
{{- end }}
{{- if ne .Values.gateway.tls.source "externalGateway" }}
{{- fail "gateway.tls.source must be externalGateway" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "constellation.fullname" . }}
  labels:
    {{- include "constellation.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.sectionName }}
  hostnames:
    - {{ .Values.gateway.host | quote }}
  rules:
{{- if .Values.api.enabled }}
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: {{ include "constellation.fullname" . }}-api
          port: {{ .Values.api.service.port }}
{{- end }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "constellation.fullname" . }}-frontend
          port: {{ .Values.frontend.service.port }}
{{- end }}
