{{- if .Values.dockerBenchWorker.enabled }}
{{- fail "dockerBenchWorker is unsupported: a qualified image bundling docker-bench-security and configuration is required" }}
{{- end }}
{{- if .Values.kubeBenchWorker.enabled }}
{{- $repository := required "kubeBenchWorker.enabled requires image.repository containing the runner, kube-bench, and cfg tree" .Values.kubeBenchWorker.image.repository -}}
{{- $claim := required "kubeBenchWorker.enabled requires state.existingClaim for durable private execution state" .Values.kubeBenchWorker.state.existingClaim -}}
{{- $tag := default (include "constellation.imageTag" .) .Values.kubeBenchWorker.image.tag -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "constellation.fullname" . }}-kube-bench-worker
  labels: {{- include "constellation.labels" . | nindent 4 }}
    app.kubernetes.io/component: kube-bench-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: kube-bench-worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: kube-bench-worker
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- include "constellation.pullSecrets" . | nindent 6 }}
      {{- include "constellation.podSecurityContext" . | nindent 6 }}
      hostPID: true
      terminationGracePeriodSeconds: 60
      {{- with .Values.kubeBenchWorker.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.kubeBenchWorker.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ printf "%s:%s" $repository $tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/constellation-kube-bench-runner"]
          workingDir: /opt/kube-bench
          ports:
            - { containerPort: 9090, name: admin }
          {{- include "constellation.adminProbes" . | nindent 10 }}
          env:
            - name: ADMIN_LISTEN_ADDR
              value: ":9090"
            - name: CONSTELLATION_API_URL
              value: {{ include "constellation.apiURL" . | quote }}
            - name: CONSTELLATION_KUBE_BENCH_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "constellation.runtimeAgentTokenSecret" . }}
                  key: token
                  optional: true
            - name: BENCH_PROFILE
              value: kube-bench
            - name: BENCH_BINARY
              value: /usr/local/bin/kube-bench
            - name: BENCH_ARGS
              value: {{ .Values.kubeBenchWorker.args | quote }}
            - name: BENCH_VERSION
              value: {{ .Values.kubeBenchWorker.benchmark | quote }}
            - name: BENCH_EXECUTION_WORKER
              value: "true"
            - name: BENCH_WATCH_INTERVAL
              value: {{ .Values.kubeBenchWorker.interval | quote }}
            - name: BENCH_STATE_DIR
              value: /var/lib/constellation-bench/state
            {{- $clusterID := default .Values.clusterRegistration.clusterId .Values.kubeBenchWorker.clusterId }}
            {{- if $clusterID }}
            - name: CONSTELLATION_CLUSTER_ID
              value: {{ $clusterID | quote }}
            {{- end }}
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: RUNTIME_AGENT_TOKEN_FILE
              value: /var/run/constellation/runtime-agent-token/token
          volumeMounts:
            - name: runtime-agent-token
              mountPath: /var/run/constellation/runtime-agent-token
              readOnly: true
            - name: execution-state
              mountPath: /var/lib/constellation-bench
            {{- with .Values.kubeBenchWorker.hostVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources: {{- toYaml .Values.kubeBenchWorker.resources | nindent 12 }}
      volumes:
        - name: runtime-agent-token
          secret:
            secretName: {{ include "constellation.runtimeAgentTokenSecret" . }}
        - name: execution-state
          persistentVolumeClaim:
            claimName: {{ $claim | quote }}
        {{- with .Values.kubeBenchWorker.hostVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
