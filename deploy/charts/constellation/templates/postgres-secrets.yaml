{{- /*
The three Postgres modes (statefulset / cnpg / external) are resolved to a
single canonical value by constellation.postgresMode (see _helpers.tpl), which
also fails on an invalid mode. This template renders the chart-managed
credential + DSN Secrets for the two in-cluster modes (statefulset + cnpg).
*/ -}}
{{- $mode := include "constellation.postgresMode" . -}}
{{- if or (eq $mode "statefulset") (eq $mode "cnpg") -}}
{{- /*
Postgres credentials + DSN Secret, rendered as a pre-install hook so the
migrate Job (weight -5) and the bootstrap Job (weight 0) can both find it.

For embedded mode the StatefulSet consumes these at runtime; for cloudnativepg
mode the CNPG Cluster's bootstrap.initdb.secret references the credentials
Secret (which must be type kubernetes.io/basic-auth). Neither resource is a
hook, so helm renders them AFTER hooks complete — fine, since Secrets persist.

Idempotent on upgrade: looks up the existing Secret and re-uses its password
so the Postgres data on the PVC keeps working.
*/ -}}
{{- $cnpg := eq $mode "cnpg" -}}
{{- $cfg := ternary .Values.postgres.cloudnativepg .Values.postgres.embeddedConfig $cnpg -}}
{{- $pw := $cfg.password -}}
{{- if not $pw -}}
  {{- $existing := (lookup "v1" "Secret" .Release.Namespace (printf "%s-postgres" (include "constellation.fullname" .))) -}}
  {{- if and $existing $existing.data $existing.data.password -}}
    {{- $pw = $existing.data.password | b64dec -}}
  {{- else -}}
    {{- $pw = randAlphaNum 32 -}}
  {{- end -}}
{{- end -}}
{{- /*
The DSN host differs by mode: embedded talks to the headless Service
<fullname>-postgres; cloudnativepg talks to the CNPG primary Service
<fullname>-postgres-rw.
*/ -}}
{{- $host := printf "%s-postgres" (include "constellation.fullname" .) -}}
{{- if $cnpg -}}{{- $host = printf "%s-postgres-rw" (include "constellation.fullname" .) -}}{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "constellation.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-8"
    # Keep across hook iterations and after install completes (we don't want
    # to delete the Secret with Postgres still using it).
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/resource-policy": keep
  labels: {{- include "constellation.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
{{- if $cnpg }}
# CNPG bootstrap.initdb.secret requires a kubernetes.io/basic-auth Secret with
# keys `username` and `password`.
type: kubernetes.io/basic-auth
stringData:
  username: {{ $cfg.username | quote }}
  password: {{ $pw | quote }}
{{- else }}
type: Opaque
stringData:
  username: {{ $cfg.username | quote }}
  password: {{ $pw | quote }}
  database: {{ $cfg.database | quote }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "constellation.fullname" . }}-database-url
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-8"
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/resource-policy": keep
  labels: {{- include "constellation.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
type: Opaque
stringData:
  url: "postgres://{{ $cfg.username }}:{{ $pw }}@{{ $host }}:5432/{{ $cfg.database }}?sslmode=disable"
{{- end }}
