{{- /*
Postgres credential + DSN Secrets.

Two Postgres modes exist (constellation.postgresMode in _helpers.tpl):
  cnpg     — the chart renders a CloudNativePG Cluster and owns its credentials.
  external — the operator supplies the DSN (postgres.dsn or postgres.existingSecret).

cnpg: both Secrets are pre-install/pre-upgrade hooks so the migrate Job
(weight -5) and bootstrap Job (weight 0) can find them, and so the CNPG
Cluster's bootstrap.initdb.secret (which must be type kubernetes.io/basic-auth)
exists before the Cluster is created. Idempotent on upgrade: the existing
password is looked up and re-used so the data on the PVCs keeps working.

external: only a plain <fullname>-database-url Secret is rendered, and only when
postgres.dsn is given inline without postgres.existingSecret.
*/ -}}
{{- $mode := include "constellation.postgresMode" . -}}
{{- if eq $mode "cnpg" -}}
{{- $cfg := .Values.postgres.cloudnativepg -}}
{{- $pw := $cfg.password -}}
{{- if not $pw -}}
  {{- $existing := (lookup "v1" "Secret" .Release.Namespace (printf "%s-postgres" (include "constellation.fullname" .))) -}}
  {{- if and $existing $existing.data $existing.data.password -}}
    {{- $pw = $existing.data.password | b64dec -}}
  {{- else -}}
    {{- $pw = randAlphaNum 32 -}}
  {{- end -}}
{{- end -}}
{{- /* CNPG auto-creates <fullname>-postgres-rw for the primary. */ -}}
{{- $host := printf "%s-postgres-rw" (include "constellation.fullname" .) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "constellation.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-8"
    # Keep across hook iterations and after install completes (we don't want
    # to delete the Secret with Postgres still using it).
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/resource-policy": keep
  labels: {{- include "constellation.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
# CNPG bootstrap.initdb.secret requires a kubernetes.io/basic-auth Secret with
# keys `username` and `password`.
type: kubernetes.io/basic-auth
stringData:
  username: {{ $cfg.username | quote }}
  password: {{ $pw | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "constellation.fullname" . }}-database-url
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-8"
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/resource-policy": keep
  labels: {{- include "constellation.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
type: Opaque
stringData:
  url: "postgres://{{ $cfg.username }}:{{ $pw }}@{{ $host }}:5432/{{ $cfg.database }}?sslmode=disable"
{{- else if and (eq $mode "external") .Values.postgres.dsn (not .Values.postgres.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "constellation.fullname" . }}-database-url
  labels:
    {{- include "constellation.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
type: Opaque
stringData:
  url: {{ .Values.postgres.dsn | quote }}
{{- end -}}
