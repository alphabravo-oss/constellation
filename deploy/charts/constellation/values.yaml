# Default values for Constellation.
#
# This file is documented top-to-bottom; every knob below is referenced in
# docs/deployment-helm.md (Values reference) with the default and when to change.

# ---------------------------------------------------------------------------
# Image defaults
# ---------------------------------------------------------------------------
# Each scaling-unit role (api / scanner / operator / discoverer / admission /
# runtime-agent / archiver / frontend) is published as its OWN image at
# `ghcr.io/alphabravo-oss/constellation/<role>:<tag>`.
#
# To pin every role to a specific build, set `image.tag` here. To override a
# single role (e.g. canary a new scanner) set `<role>.image.repository` and/or
# `<role>.image.tag`. For immutable deployments use `<role>.image.digest`
# (sha256 plus 64 lowercase hex characters); it takes precedence over tags.
# Digests are per-role because each role is a separate image.
# ---------------------------------------------------------------------------
# Air-gap: cluster-local registry every image is pulled from (guide ch.09).
# `constellationctl bundle load --registry <host:port> --values-out values-bundle.yaml`
# pushes every bundled image there and writes a values file pinning each role to
# its digest; pass both files to helm. Empty = pull from image.registry.
# ---------------------------------------------------------------------------
global:
  imageRegistry: ""

image:
  registry: ghcr.io/alphabravo-oss/constellation
  pullPolicy: IfNotPresent
  # Empty -> uses v-prefixed .Chart.appVersion (currently "v0.3.0"). Use immutable
  # release tags or digest-qualified role overrides in production.
  tag: ""
  # Optional list of imagePullSecrets applied to every Deployment / DaemonSet /
  # CronJob / Job and CNPG Cluster rendered by this chart.
  pullSecrets: []
  # - name: ghcr-pull-secret

# Add trusted dependency namespaces to admission, runtime, and network-policy
# protection together. Own/core namespaces are mandatory. Namespace-wide scope
# also exempts unrelated workloads there; use dedicated dependency namespaces.
systemProtection:
  protectedNamespaces: []

# Keep rollout history short so repeated local/edge upgrades do not leave
# zero-replica ReplicaSets pinned to stale role image tags.
revisionHistoryLimit: 3

# ---------------------------------------------------------------------------
# High availability and disruption safety
# ---------------------------------------------------------------------------
# Enable for multi-node installations. Every replicated control-plane
# Deployment is spread across nodes using pod-template-hash-aware constraints,
# so a rollout cannot satisfy spreading with terminating pods from the old
# revision. A maxUnavailable=1 PDB protects each enabled Deployment.
highAvailability:
  enabled: false
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: DoNotSchedule
  pdb:
    enabled: true
    maxUnavailable: 1

# ---------------------------------------------------------------------------
# Default pod/container security posture
# ---------------------------------------------------------------------------
# Applied to non-privileged Constellation application workloads. Hook helper
# containers and the in-cluster object store render their own non-root
# restricted contexts (CNPG manages its own pods), while the runtime agent keeps
# an explicit privileged context because BPF/TC/NFQUEUE need host privileges.
security:
  podSecurityContext:
    enabled: true
    fsGroup: 10001
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    enabled: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: true
    runAsGroup: 10001
    runAsNonRoot: true
    runAsUser: 10001

# ---------------------------------------------------------------------------
# Namespace network policy
# ---------------------------------------------------------------------------
# Disabled in the default/dev profile because not every local CNI enforces
# NetworkPolicy the same way. Enable in production values to render default-deny
# plus explicit flows between Constellation components, DNS, Kubernetes API,
# artifact registries, and external Postgres.
networkPolicies:
  enabled: false
  dns:
    enabled: true
    cidrs: ["0.0.0.0/0"]
  externalHTTP:
    enabled: true
    cidrs: ["0.0.0.0/0"]
    ports: [80, 443]
  kubeAPI:
    cidrs: ["0.0.0.0/0"]
    ports: [443, 6443]
  externalPostgres:
    cidrs: ["0.0.0.0/0"]
    ports: [5432]
  cnpgOperator:
    namespace: cnpg-system
    podLabels:
      app.kubernetes.io/name: cloudnative-pg
  # Allowed ingress/Gateway sources; also used for its direct /api route.
  # Set api.env.CONSTELLATION_TRUSTED_PROXIES to the actual proxy peers.
  frontendIngressCIDRs: ["0.0.0.0/0"]
  admissionIngressCIDRs: ["0.0.0.0/0"]
  # Required when NetworkPolicy and the host-network runtime agent are both
  # enabled: include the Kubernetes node/private-network CIDRs so node-sourced
  # inventory and telemetry can reach the API Service.
  apiIngressCIDRs: []
  # Node/private CIDRs admitted to in-cluster Postgres, the object store and the
  # metrics ports (kubelet probes and host-network pods originate here).
  nodeCIDRs: []
  # Prometheus scrapes: ingress from this namespace to every metrics port.
  monitoring:
    enabled: true
    namespace: monitoring
    ports: [8080, 8081, 8082, 8090, 8443, 9090, 9187, 9404]
  # In-cluster CNPG (postgres.mode=cnpg, or external mode pointing at a CNPG
  # cluster in this namespace): policies for the instance pods, the object
  # store, the backup/sync jobs and optional exporters.
  cnpg:
    enabled: true
    clusterName: ""            # empty = <fullname>-postgres
    exporterLabels: [postgres-exporter, prometheus-postgres-exporter]
    # extra namespaces that may reach the object store (recovery drills)
    objectStoreClientNamespaces: []
    # Pod labels of an object store not rendered by this chart (e.g. a
    # hand-deployed RustFS labelled app: rustfs); empty = backup.objectStore.
    objectStoreSelector: {}
  # Off-host endpoints the backup/sync jobs may reach (CIDR, TCP 9000 unless :port given).
  offhostCIDRs: []

# ---------------------------------------------------------------------------
# Cluster registration
# ---------------------------------------------------------------------------
# At install time the bootstrap hook always creates the installed cluster row
# so GlobalAdmins immediately see the local cluster in the UI. When enabled,
# it also creates a ConstellationCluster CR for the operator path.
clusterRegistration:
  enabled: true
  name: ""        # defaults to .Release.Namespace
  clusterId: ""   # optional explicit UUID; otherwise components send cluster_name and the API resolves it
  orgID: ""       # defaults to the bootstrap org created by the token Job
  # Wave E (testnode fix): the bootstrap-job inserts a row into the
  # `clusters` DB table at install time. Previously this was the discoverer
  # binary's job, but the discoverer isn't in the default install profile,
  # so a fresh install used to leave the table empty — anything that needs
  # a cluster_id (quarantine, scoped lists, multi-cluster fan-in) had no
  # row to talk to. These values populate that row. The agent's heartbeat
  # later updates state/last_heartbeat_at; anything below can be overwritten.
  distro: "kubernetes"        # kubernetes | k3s | k3d | kind | eks | gke | aks | openshift | rke2 | microk8s
  cloudProvider: ""           # aws | gcp | azure | onprem | "" (unknown)
  region: ""                  # eg. us-east-1, leave empty for on-prem

controlPlane:
  # Optional external API base URL used by in-cluster components for heartbeats
  # and component-to-API calls. Empty defaults to the in-cluster API Service.
  apiURL: ""

# ---------------------------------------------------------------------------
# Kubernetes discoverer
# ---------------------------------------------------------------------------
# Watches the installed Kubernetes cluster and populates deployments,
# deployment assets, pod IPs, Service IPs, and workload risk rollups. This is
# enabled by default so the local/in-cluster install immediately has data behind
# /clusters/<id> views instead of only an empty registered cluster row.
discoverer:
  enabled: true
  # Existing Secret with key "token", issued for this cluster by an init bundle.
  # Empty shares runtimeAgent.tokenSecret; an unbound bootstrap token cannot
  # submit platform facts. A dedicated secret permits independent enrollment.
  tokenSecret: ""
  replicas: 1
  image: {}
  args: []
  # Empty defaults to clusterRegistration.name, then the release namespace.
  clusterName: ""
  # Optional explicit org UUID. When empty, the discoverer resolves the existing
  # cluster row by name; set this if multiple orgs can register same-named clusters.
  orgID: ""
  namespaceFilter: "*"
  reconcileInterval: 30s
  resources:
    limits:   { cpu: 300m, memory: 256Mi }
    requests: { cpu: 50m,  memory: 64Mi }

# ---------------------------------------------------------------------------
# Column encryption (guide ch.06): age X25519 key set for registry credentials,
# git PATs, federation keys and init bundles. Exactly one of:
#   crypto.ageKey         - identities (AGE-SECRET-KEY-1..., current first, one per
#                           line) written into Secret <release>-age-key by the chart
#   crypto.existingSecret - operator-managed Secret with key `age-key`
#   neither               - a pre-install hook mints one with age-keygen (toolbox
#                           image) and keeps it across upgrades
# Rotate: put the new identity first, roll the API, run
# `constellationctl admin rotate-keys`, drop the old identity.
# ---------------------------------------------------------------------------
crypto:
  ageKey: ""
  existingSecret: ""

# Operator toolbox image (age + kubectl + rclone, non-root): age-key bootstrap
# hook and the secrets-backup CronJob.
toolbox:
  image: {}
    # repository: ghcr.io/alphabravo-oss/constellation/toolbox
    # tag: v0.3.0

# ---------------------------------------------------------------------------
# Monitoring (Prometheus Operator). Off by default: the monitoring.coreos.com
# CRDs are not bundled. Component heartbeat age, scanner engine-DB age (incl.
# Trivy java-db) and CVE-feed age are first-class API metrics, so no
# postgres-exporter is required; metrics.postgresRole still renders a read-only
# role for an optional exporter.
# ---------------------------------------------------------------------------
metrics:
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}          # e.g. { release: kube-prometheus-stack }
    namespace: ""       # empty = release namespace
  prometheusRule:
    enabled: false
    namespace: ""
    labels: {}
    includeClusterRules: true   # node/pod/PVC generic alerts
    thresholds:
      heartbeatStaleSeconds: 120
      engineDBStaleSeconds: 172800
      cveFeedStaleSeconds: 172800
  # Read-only Postgres role for an external exporter (CNPG managed.roles +
  # migration-owned grants on component_heartbeats / cve_feed_checkpoints).
  postgresRole:
    enabled: false
    name: constellation_metrics

# ---------------------------------------------------------------------------
# Control plane API
# ---------------------------------------------------------------------------
api:
  # Bounded hourly ANALYZE of partitioned parents; disable when managed externally.
  partitionStatisticsMaintenanceEnabled: true
  enabled: true
  replicas: 2
  image: {}
    # repository: ghcr.io/alphabravo-oss/constellation/api
    # tag: v0.3.0
  args: []
  # Durable packet evidence is opt-in and always uses an operator-owned PVC.
  # Single-replica RWO uses Recreate; multiple replicas require shared RWX.
  # The claim must be Bound and writable by the configured API UID/fsGroup.
  # No ephemeral fallback: disabled keeps the existing storage configuration.
  pcapStorage:
    enabled: false
    existingClaim: ""
    accessMode: ReadWriteOnce
    # Expire DB-backed captures only after this same durable claim is verified.
    retentionEnabled: false
  service:
    type: ClusterIP
    port: 8080
  # Observability. The API serves /metrics (and pprof when enabled) on a
  # separate admin listener (ADMIN_LISTEN_ADDR=:9090, container/Service port
  # `admin`), never on the API port, so metrics are not reachable through the
  # Ingress/Gateway /api route.
  metrics:
    # prometheus.io/scrape|port|path pod annotations for annotation-based
    # discovery (kube-prometheus-stack's additionalScrapeConfigs, Grafana
    # Alloy, Datadog, …).
    annotations: true
    # monitoring.coreos.com/v1 ServiceMonitor targeting the `admin` port.
    # Requires the Prometheus Operator CRDs; off by default so a cluster
    # without them still installs.
    serviceMonitor:
      enabled: false
      interval: 30s
      scrapeTimeout: 10s
      # Extra labels so a Prometheus `serviceMonitorSelector` picks it up,
      # e.g. { release: kube-prometheus-stack }.
      labels: {}
      # Namespace to create the ServiceMonitor in; empty = release namespace.
      namespace: ""
    # With networkPolicies.enabled, ingress to the admin port is allowed from
    # pods in the release namespace only. Set a namespaceSelector (label map)
    # to also admit a monitoring namespace, e.g.
    #   allowFrom: { kubernetes.io/metadata.name: monitoring }
    allowFrom: {}
  resources:
    limits:   { cpu: 1,    memory: 1Gi }
    requests: { cpu: 200m, memory: 256Mi }
  env:
    OTEL_EXPORTER_OTLP_ENDPOINT: ""
    GOMEMLIMIT: 110MiB
    GOGC: "75"
  # Optional existing Secret containing the support-bundle Ed25519 private key.
  # The key is mounted read-only; this chart never creates private key material.
  supportBundleSigningKeySecret: ""
  supportBundleSigningKeySecretKey: private-key.pem
  # D5: leader election for singleton background loops (CVE reconcilers,
  # fed-sync, rescan/retention monitors). Enabled because the clean-install
  # default has two API replicas; only the lease holder runs singleton work.
  # Disable only when api.replicas=1 and avoiding an API ServiceAccount token is
  # more important than seamless scale-out.
  leaderElection:
    enabled: true
    # Lease name + namespace are derived from the release; override if needed.
    leaseName: ""

# ---------------------------------------------------------------------------
# Federation (FED-JOIN-25) — joint-side config
# ---------------------------------------------------------------------------
# Set masterUrl to make this controller a JOINT of a federation master. The
# background poller then pulls that master's federated rules, and both
# `constellationctl federation join` and POST /federation/join-remote fall back
# to these values when no master_url/token is supplied. Leave masterUrl empty
# (the default) for a standalone or master controller.
federation:
  # Base URL of the federation master, e.g. https://master.example.com. Empty =
  # not a joint (no federation env is injected at all).
  masterUrl: ""
  # Join token minted by the master (constellationctl on the master / the
  # /federation/join-tokens API). Prefer joinTokenSecret over an inline value.
  joinToken: ""
  # Optional: read the join token from an existing Secret instead of joinToken.
  # When set it wins over joinToken.
  joinTokenSecret: ""
  joinTokenSecretKey: "token"

# ---------------------------------------------------------------------------
# Kubernetes operator (reconciles ConstellationCluster CRs)
# ---------------------------------------------------------------------------
operator:
  enabled: true
  replicas: 1
  # Leader election is on by default so scaling replicas up never runs two
  # reconcilers; the chart renders the Lease/Event RBAC (operator-workloads
  # Role/ClusterRole). Disabling is only for single-replica debugging.
  leaderElection:
    enabled: true
  image: {}
  # Extra args. The chart always passes --leader-elect and the four managed
  # image flags (--agent-image/--runtime-agent-image/--scanner-image/
  # --admission-image) derived from the role images, so the operator has no
  # `:latest` fallback.
  args: []
  resources:
    limits:   { cpu: 500m, memory: 512Mi }
    requests: { cpu: 100m, memory: 128Mi }

# ---------------------------------------------------------------------------
# Network policy lifecycle applier
# ---------------------------------------------------------------------------
# Consumes approved Network Map lifecycle manifest bundles from Postgres and
# applies/deletes the selected Kubernetes policy flavor in this cluster.
networkPolicyApplier:
  enabled: true
  # Additive only: own namespace and Kubernetes system namespaces are mandatory.
  protectedNamespaces: []
  # native | cilium | calico. Native works on any CNI that enforces Kubernetes
  # NetworkPolicy; Cilium and Calico require their CRDs to be installed.
  flavor: native
  interval: 15s
  replicas: 1
  # Prefer clusterId for multi-org/multi-cluster installs. When empty, the
  # applier resolves clusterName against the `clusters` table.
  clusterId: ""
  # Empty defaults to clusterRegistration.name, then the release namespace.
  clusterName: ""
  image: {}
  resources:
    limits:   { cpu: 200m, memory: 256Mi }
    requests: { cpu: 50m,  memory: 64Mi }

# ---------------------------------------------------------------------------
# Kubernetes object compliance collector
# ---------------------------------------------------------------------------
# Reads live Kubernetes objects and persists direct object evidence into
# compliance_checks for scheduled reports and /api/v1/compliance/evidence.
kubernetesComplianceCollector:
  enabled: true
  schedule: "17 */6 * * *"
  # Prefer clusterId for multi-org/multi-cluster installs. When empty, the
  # collector resolves clusterName against the `clusters` table.
  clusterId: ""
  # Empty defaults to clusterRegistration.name, then the release namespace.
  clusterName: ""
  namespaceFilter: "*"
  includeSystemNamespaces: false
  image: {}
  resources:
    limits:   { cpu: 200m, memory: 256Mi }
    requests: { cpu: 50m,  memory: 64Mi }

# ---------------------------------------------------------------------------
# kube-bench / docker-bench runner (opt-in)
# ---------------------------------------------------------------------------
# Runs the upstream kube-bench (or docker-bench) binary on a schedule, reads its
# --json report, and POSTs it to /api/v1/compliance/ingest. Disabled by default
# because the image must bundle the upstream benchmark binary — set
# image.repository to such an image (no default chart image ships kube-bench).
kubeBenchRunner:
  enabled: false
  schedule: "37 */6 * * *"
  # "kube-bench" or "docker-bench"; selects the server-side ingest parser.
  profile: kube-bench
  # Upstream binary to exec; must be present in the image.
  binary: kube-bench
  # Extra args passed to the binary (whitespace-split). "--json" is appended
  # automatically when absent.
  args: ""
  clusterId: ""
  clusterName: ""
  image:
    repository: ""
    tag: ""
  # Host paths kube-bench needs to audit (config files, kubelet, etc.). Empty by
  # default; supply for your distro, e.g. mount /etc and /var read-only.
  hostVolumes: []
  hostVolumeMounts: []
  resources:
    limits:   { cpu: 200m, memory: 256Mi }
    requests: { cpu: 50m,  memory: 64Mi }

# ---------------------------------------------------------------------------
# docker-bench runner (opt-in) — CMP-DOCKER-33
# ---------------------------------------------------------------------------
# Mirror of kubeBenchRunner for CIS Docker host controls. Runs the upstream
# docker-bench-security script on a schedule and POSTs its JSON to
# /api/v1/compliance/ingest?profile=docker-bench (the server-side docker-bench
# parser already exists). Disabled by default; the image must bundle the
# docker-bench-security binary alongside the constellation-kube-bench-runner.
dockerBenchRunner:
  enabled: false
  schedule: "47 */6 * * *"
  # Selects the server-side ingest parser; keep "docker-bench".
  profile: docker-bench
  # Upstream binary/script to exec; must be present in the image.
  binary: docker-bench-security
  # Extra args passed to the binary (whitespace-split). "--json" is appended
  # automatically when absent.
  args: ""
  clusterId: ""
  clusterName: ""
  image:
    repository: ""
    tag: ""
  # Host paths docker-bench needs to audit (docker daemon config, socket, etc.).
  # Empty by default; supply for your host, e.g. mount /etc, /var/lib, and the
  # docker socket read-only.
  hostVolumes: []
  hostVolumeMounts: []
  resources:
    limits:   { cpu: 200m, memory: 256Mi }
    requests: { cpu: 50m,  memory: 64Mi }

# ---------------------------------------------------------------------------
# Durable benchmark worker (opt-in)
# ---------------------------------------------------------------------------
# Durable on-demand execution is separate from scheduled benchmark CronJobs.
# One worker inspects its assigned node; it does not establish fleet coverage.
kubeBenchWorker:
  enabled: false
  image:
    repository: ""
    tag: ""
  interval: "30s"
  benchmark: ""
  args: ""
  clusterId: ""
  state:
    # Required: a durable PVC, exclusive to this worker (never emptyDir).
    existingClaim: ""
  nodeSelector: {}
  tolerations: []
  hostVolumes: []
  hostVolumeMounts: []
  resources:
    limits: { cpu: 200m, memory: 256Mi }
    requests: { cpu: 50m, memory: 64Mi }
# No qualified image currently bundles docker-bench-security plus configuration.
# Enabling this explicitly fails chart rendering instead of creating a fake job.
dockerBenchWorker:
  enabled: false

# ---------------------------------------------------------------------------
# Admission webhook
# ---------------------------------------------------------------------------
# The admission Deployment serves /validate over HTTPS. TLS material is
# bootstrapped by a pre-install Job (see `tls.bootstrap`) unless cert-manager
# is present and `tls.certManager.enabled=true`.
admission:
  enabled: true
  replicas: 2
  image: {}
  args: []
  resources:
    limits:   { cpu: 500m, memory: 512Mi }
    requests: { cpu: 100m, memory: 128Mi }
  service:
    type: ClusterIP
    port: 443        # ValidatingWebhookConfiguration always calls 443
    targetPort: 8443 # The pod listens on 8443 TLS
  # Built-in rules (block-privileged/host-network/host-pid) are skipped for these
  # namespaces and for any namespace labelled
  # constellation.alphabravo.io/admission=ignore — node-exporter, CNI, ingress
  # controllers and the operator stack legitimately use hostNetwork.
  exemptNamespaces: [kube-system, kube-public, kube-node-lease, cnpg-system, cert-manager, ingress-nginx, monitoring]
  exemptNamespaceLabel: constellation.alphabravo.io/admission
  # ValidatingWebhookConfiguration tuning. failurePolicy=Ignore is the safe
  # default so a degraded webhook never blocks pod admission cluster-wide.
  webhook:
    enabled: true
    failurePolicy: Ignore
    timeoutSeconds: 5
    sideEffects: None
    # Restrict the webhook to specific namespaces by setting a namespaceSelector.
    # Default is empty (cluster-wide). Set e.g.:
    #   namespaceSelector:
    #     matchLabels: { constellation.alphabravo.io/enforce: "true" }
    namespaceSelector: {}
    # C2: the engine evaluates Pods, the 7 controller kinds that embed a pod
    # template, and PVCs (storageClassName gate). The API server only sends an
    # object to the webhook when a rule matches it, so all of those resources must
    # be registered here — otherwise a privileged pod spec embedded in a
    # Deployment/Job/CronJob template is never intercepted.
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers", "replicationcontrollers", "persistentvolumeclaims"]
        scope: "Namespaced"
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
        scope: "Namespaced"
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
        scope: "Namespaced"
  # E4: runtime quarantine deny-list. When enabled, the admission webhook
  # polls the constellation-api database for active quarantine entries and
  # rejects any pod matching one. Entries are added via the
  # /api/v1/quarantine API (manual flow). The auto-trigger from runtime
  # alerts is wired through the same table once the workload resolver
  # lands (C2 follow-up). Independent of admission.webhook so a cluster
  # can run quarantine-only or policy-rules-only.
  quarantine:
    enabled: false
    # When empty, use the shared database DSN Secret, including postgres.dsn
    # or postgres.existingSecret in external mode. An override SHOULD use a read-only role
    # scoped to quarantine_entries (the webhook never writes).
    dsn: ""
    refresh: "5s"
    # readyz starts failing once the snapshot is older than this — at which
    # point kubelet will stop sending it requests until it recovers.
    maxStale: "60s"
    # MUST be the UUID of the cluster this admission webhook runs in.
    # Set explicitly: an empty value leaves quarantine disabled even when enabled=true.
    clusterId: ""
  # DB-backed admission policies. When enabled, the webhook loads enabled
  # `constellation-admission` policy rows for the configured cluster's org and
  # refreshes them in-process. Finding-backed rules remain imported as policy
  # rows but are skipped by the local pod-spec evaluator until the evidence
  # lookup path is enabled.
  policies:
    enabled: false
    dsn: ""
    refresh: "10s"
    # Defaults to admission.quarantine.clusterId when empty.
    clusterId: ""
  # Hash-chained audit persistence for live webhook deny decisions. When
  # enabled, the webhook writes `admission.deny` rows to audit_events with the
  # org_id resolved from the configured cluster row.
  audit:
    enabled: false
    dsn: ""
    # Defaults to admission.policies.clusterId, then admission.quarantine.clusterId.
    clusterId: ""

# ---------------------------------------------------------------------------
# Scanner (image / SBOM scanning worker)
# ---------------------------------------------------------------------------
scanner:
  # Registry hosts (host[:port]) the scanner reaches over plain HTTP — the air-gap
  # cluster-local registry. Empty = TLS everywhere.
  insecureRegistries: []
  enabled: true
  replicas: 2
  image: {}
  args: []
  # Syft + Trivy + Grype are memory-heavy together; keep the out-of-box worker
  # conservative and scale scanner replicas or raise this value once memory is sized.
  # Set 0 to let a scanner auto-size from runtime.NumCPU().
  maxConcurrent: 1
  targetCapacity: "" # e.g. "image=2,host=8,platform=4"; empty uses global concurrency for all target types.
  # Optional kubernetes.io/dockerconfigjson Secret for discovered private images
  # without a registry connector binding. Grants this worker pull access to its
  # entries; explicit per-job connector credentials still take precedence.
  registryConfigSecret: ""
  leaseRenewInterval: 5m
  cache:
    # Persist the vuln-DB caches (grype/trivy/syft, ~3.3GB) on a PVC so redeploys don't
    # re-download them and the DB survives pod restarts, decoupled from the image. RWO,
    # so it activates ONLY with a single, non-autoscaled replica (otherwise emptyDir).
    # To use it, set scanner.replicas=1 and scanner.autoscaling.enabled=false.
    persistent: true
    size: 8Gi
    storageClass: "" # "" = cluster default StorageClass
  service:
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/path: /metrics
      prometheus.io/port: "8090"
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: null
    externalMetrics: []
  engines:
    # Syft provides package/SBOM inventory. Trivy and Grype provide
    # vulnerability analysis and corroborate each other's results.
    syft: true
    trivy: true
    grype: true
  # Trivy/Grype vulnerability-DB freshness. refreshInterval is the env default
  # cadence; admins can override it live from the UI (Settings → scanner DB
  # refresh, stored in system_config). offline=true = air-gapped: scanners never
  # pull DBs from the internet (pre-load them — see docs/offline-scanning.md),
  # optionally pointing Trivy at an internal OCI mirror via trivyDBRepository.
  vulnDB:
    refreshInterval: 6h
    # Air-gap first (guide ch.08/09): scanners never fetch DBs unless this is false.
    offline: true
    trivyDBRepository: ""
    trivyJavaDBRepository: ""
  signatures:
    enabled: true
    mode: keyless
    requireRekor: false
    identities: []
    issuers: []
    publicKeySecret: ""
    publicKeySecretKey: cosign.pub
    publicKeyPath: ""
    cosignBin: cosign
  fileRisks:
    enabled: true
    maxFindings: 500
  resources:
    # One image scan runs Syft, Trivy and Grype concurrently. Reserve memory for
    # the worker plus those child processes, not just the Go worker heap.
    limits:   { cpu: 2,    memory: 6Gi }
    requests: { cpu: 250m, memory: 2Gi }
  # SCANNER_TOKEN env wiring. The bootstrap Job creates this Secret unless an
  # existing one is referenced here.
  tokenSecret: ""        # defaults to <release>-scanner-token

# ---------------------------------------------------------------------------
# Runtime agent (eBPF + NeuVector dp DaemonSet)
# ---------------------------------------------------------------------------
# The agent runs two data planes on every node:
#   - eBPF programs for sched_process_exec + LSM file_open  (process + file events)
#   - vendored NeuVector C dp for AF_PACKET DPI on per-pod veths
#     (network flows, L7 from DPI parsers, threat signatures with packet capture)
#
# Resource notes:
#   - Memory floor is dominated by dp's hyperscan databases (~120 MiB) plus
#     the per-pod TCP/UDP session table (proportional to concurrent flows).
#     1 Gi limit accommodates ~500 active pod taps × ~2k sessions each.
#   - CPU is mostly dp's per-packet DPI inspection. 500m sustains ~50 Mbps
#     of inspected traffic in TAP mode; bump for higher-throughput nodes.
runtimeAgent:
  enabled: true
  # Persistent event/flow queues, each bounded independently. Survives pod
  # replacement on the same node; node/disk loss requires external replication.
  telemetrySpool:
    hostPath: /var/lib/constellation/telemetry
    bytesPerStream: 268435456
  image: {}
  args: []
  # Optional execution-enforcer dry-run override. Omission keeps the agent's
  # existing default; explicit true prevents executable enforcement effects.
  # Explicit false is supported and does not arm the other enforcement gates.
  # execDryRun: true
  resources:
    limits:   { cpu: "1",    memory: 1Gi }
    requests: { cpu: 200m,   memory: 256Mi }
  tokenSecret: ""        # defaults to <release>-runtime-agent-token
  # Runtime enforcement — whether the agent BLOCKS policy violations (out-of-baseline
  # process exec, protected-file access, exec of a drifted binary) or only alerts.
  #   disabled = never enforce (detect-only, hard off)
  #   monitor  = detect + alert only (safe default; no blocking)
  #   protect  = enforce per-workload baseline: a workload whose baseline is set to
  #              "enforce" (in the UI) blocks; "monitor"/"learn" workloads only alert.
  # This mirrors NeuVector's Protect mode: flip to `protect` and per-workload enforce
  # bites with NO manual DaemonSet edit. Per-enforcer toggles narrow what protect arms.
  enforcement:
    mode: monitor        # disabled | monitor | protect
    process: true        # kill out-of-baseline execs (when mode=protect)
    file: true           # deny protected-file access (when mode=protect)
    exec: true           # block exec of drifted binaries (when mode=protect)
    # network: arm the INLINE (NFQUEUE) network datapath so dp's policy Deny /
    # WAF / DLP verdicts actually DROP packets (NeuVector-style inline enforcer),
    # instead of only alerting in tap mode. Requires mode=protect. Default OFF —
    # this is the highest-risk enforcer: it routes a pod's packets through dp.
    # SAFETY: (1) per-workload — a pod goes inline ONLY when it carries the label
    #   dpi.constellation.alphabravo.io/enforce=true, so turning this on affects
    #   NO existing workload until you label one; (2) fail-OPEN — the iptables
    #   redirect uses --queue-bypass, so if dp dies the pod stays connected;
    #   (3) only on NFQUEUE-safe CNIs (flannel/calico/kube-router — NOT Cilium
    #   eBPF unless dp.enforceOnCilium is set). Verify on a canary before scaling.
    network: false       # arm inline NFQUEUE enforcement (when mode=protect)
    # dpi: arm L7 inline enforcement — WAF (OWASP CRS) and DLP verdicts RESET/DROP
    # the offending session inline, instead of only alerting. Requires mode=protect
    # AND network=true (the pod must be on the NFQUEUE datapath for dp to have a
    # verdict path) AND the per-workload labels dpi.constellation.alphabravo.io/waf
    # (or /dlp) = true. Default OFF — L7 rules can false-positive (e.g. CRS SQLi on a
    # workload's own DB egress); opt a workload in by label and verify on a canary.
    dpi: false           # arm WAF/DLP inline drop/reset (when mode=protect + network)
    # ADDITIVE ONLY: extra namespaces enforcement must never touch. The core
    # protected set — this release's own namespace, kube-system/kube-public/
    # kube-node-lease, and the host itself — is baked into the agent and cannot be
    # removed. Use this to shield additional infra namespaces (e.g. your CNI,
    # monitoring) from ever being blocked/killed by a rule.
    protectedNamespaces: []
  # Tolerations let the DaemonSet land on tainted control-plane / GPU nodes.
  tolerations:
    - operator: Exists
      effect: NoSchedule
    - operator: Exists
      effect: NoExecute
  # Liveness / readiness probes — the agent listens on healthPort and answers
  # /healthz (alive: process started) + /readyz (ready: dp keepalive replied
  # at least once + tap reconciler ran at least once). Probe failure forces
  # a restart so a wedged dp doesn't silently stop reporting.
  healthPort: 9404
  livenessProbe:
    httpGet: { path: /healthz, port: 9404 }
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 3
    failureThreshold: 3
  readinessProbe:
    httpGet: { path: /readyz, port: 9404 }
    initialDelaySeconds: 15
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 4
  # NeuVector dp (vendored in third_party/neuvector). Set false to skip the
  # C data-plane entirely — the agent will still ship exec + file events
  # from BPF, but no network metrics will be observed.
  dp:
    enabled: true
    # Worker thread count passed as `-n N` to dp. NeuVector hardcodes 1 in
    # their monitor; bumping helps on nodes with high pod density (≥100 pods).
    threads: 1
    # Veth name prefixes the auto-discovery sysfs scan considers as "pod"
    # interfaces. Default covers Flannel/k3s (veth*), Calico (cali*),
    # Cilium LXC (lxc*). Add custom CNI prefixes here.
    vethPrefixes: "veth,cali,lxc"
    # Override the env-var bootstrap provider (env|podveth|none). Leave empty
    # for the default priority: env if CONSTELLATION_DP_TAP_PORTS set, else podveth.
    provider: ""
    # Wave D1: Cilium clusters bypass iptables in their default eBPF mode,
    # so dp's NFQUEUE-based enforcement silently no-ops. The agent
    # auto-detects Cilium and skips installing enforce iptables rules
    # unless this flag is set. Operators with Cilium iptables-only mode
    # can override and let dp run enforcement normally.
    enforceOnCilium: false
    # Override the CNI config dir auto-discovery with an explicit path.
    # Leave empty (default) to let the agent probe every known location
    # (kubeadm, k3s, RKE2, OpenShift OVN, microk8s — see
    # internal/runtime/dp/cnidetect.CandidateCNIDirs). Set this only when
    # the host has a non-standard CNI install location.
    cniDir: ""
  # Host-facts collector. Snapshots host OS / kernel / modules / CNI /
  # CRI every `interval` and POSTs to /api/v1/host-facts:report.
  # Mirrors what NeuVector's enforcer ships in its host inventory.
  hostScan:
    # Leave empty for the agent's default (5m).
    interval: ""
  # PodDisruptionBudget keeps at least one runtime-agent up during voluntary
  # disruptions (node drain, upgrade). DaemonSet PDBs cap on minAvailable,
  # not maxUnavailable — minAvailable=1 means a per-node drain is allowed.
  pdb:
    enabled: true
    minAvailable: 1

# ---------------------------------------------------------------------------
# Frontend (Vite SPA served by nginx, /api proxied to the API Service)
# ---------------------------------------------------------------------------
frontend:
  enabled: true
  replicas: 2
  image: {}
    # repository: ghcr.io/alphabravo-oss/constellation/frontend
  args: []
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  resources:
    limits:   { cpu: 200m, memory: 128Mi }
    requests: { cpu: 50m,  memory: 32Mi }

# ---------------------------------------------------------------------------
# Optional Ingress (frontend only — API is proxied through nginx)
# ---------------------------------------------------------------------------
ingress:
  enabled: false
  className: ""           # e.g. "nginx", "traefik", "alb"
  host: constellation.example.com
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    enabled: false
    secretName: constellation-frontend-tls

# Gateway API route for clusters with a shared platform Gateway. This is
# independent of `ingress`; normally enable only one. With source
# externalGateway, TLS terminates on the named Gateway listener and this chart
# deliberately creates no Certificate or TLS Secret.
gateway:
  enabled: false
  name: public
  namespace: platform-gateway
  sectionName: https
  host: constellation.example.com
  tls:
    source: externalGateway # externalGateway is currently the supported mode

# ---------------------------------------------------------------------------
# Postgres (CloudNativePG in-cluster, or an external DSN)
# ---------------------------------------------------------------------------
postgres:
  # Canonical Postgres mode. One of:
  #   cnpg     — HA Postgres managed by the CloudNativePG operator (default;
  #              the production path, see ADR 0007).
  #   external — point the app DSN at an external Postgres (RDS, Cloud SQL,
  #              a CNPG cluster managed outside this release…); dev/test.
  # When empty the mode is derived from `cloudnativepg.enabled`. An explicit
  # mode wins. The former embedded single-replica StatefulSet mode was removed;
  # there is no in-chart Postgres other than CNPG.
  mode: cnpg
  # Set for external mode. Either supply a DSN string here OR reference an
  # existing Secret with key `url`.
  dsn: ""
  existingSecret: ""        # if set, takes precedence over `dsn`
  existingSecretKey: url

  # -------------------------------------------------------------------------
  # CloudNativePG (CNPG) mode — production HA Postgres managed by the CNPG
  # operator.
  #
  # PREREQUISITE: the CloudNativePG operator MUST already be installed in the
  # cluster (it is NOT bundled by this chart). Install it once, cluster-wide,
  # before `helm install`:
  #   kubectl apply --server-side -f \
  #     https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.24/releases/cnpg-1.24.1.yaml
  # (or `helm install cnpg cnpg/cloudnative-pg -n cnpg-system --create-namespace`).
  # Docs: https://cloudnative-pg.io/documentation/current/installation_upgrade/
  # A ready-made profile lives at examples/values-cnpg.yaml.
  #
  # CNPG auto-creates the services <fullname>-postgres-rw (primary/read-write),
  # -ro (replicas) and -r (any); the chart points DATABASE_URL at the -rw one.
  # -------------------------------------------------------------------------
  cloudnativepg:
    # Only consulted when `postgres.mode` is empty.
    enabled: true
    # 1 = dev/single instance, 3 = HA (1 primary + 2 replicas). Use 3 in prod.
    instances: 3
    # CRITICAL: this image MUST include the pgvector extension — the schema uses
    # `embedding vector(1536)` in the findings table. The default CNPG image
    # (ghcr.io/cloudnative-pg/postgresql) does NOT include pgvector.
    #
    # Empty -> <image.registry>/postgres:16.15-v<Chart.appVersion>, the chart's
    # own CNPG-compatible pgvector build (deploy/docker/Dockerfile.postgres).
    # Independent of image.tag; use a version-bearing tag@digest override to pin.
    # NOTES.txt warns when a CUSTOM imageName does not contain "pgvector".
    imageName: ""
    storage: 20Gi
    storageClass: ""        # empty = cluster default
    resources:
      limits:   { cpu: 2,   memory: 2Gi }
      requests: { cpu: 200m, memory: 256Mi }
    primaryUpdateStrategy: unsupervised
    # CNPG schedules the primary and replicas on separate nodes in HA mode.
    affinity:
      enabled: true
      topologyKey: kubernetes.io/hostname
      podAntiAffinityType: required
    # Optional raw CNPG backup spec (legacy in-core barmanObjectStore). Prefer
    # barmanCloud below (CNPG-I plugin); the two are mutually exclusive.
    # Example:
    # backup:
    #   barmanObjectStore:
    #     destinationPath: s3://constellation-postgres
    #     endpointURL: https://s3.example.com
    #     s3Credentials:
    #       accessKeyId: { name: cnpg-backup, key: ACCESS_KEY_ID }
    #       secretAccessKey: { name: cnpg-backup, key: SECRET_ACCESS_KEY }
    #   retentionPolicy: "30d"
    backup: {}
    # CNPG-I Barman Cloud plugin. The plugin itself is installed separately
    # (https://github.com/cloudnative-pg/plugin-barman-cloud). The ObjectStore
    # CR it archives to is either supplied by the infrastructure operator
    # (objectStoreName) or rendered by this chart from backup.objectStore
    # (objectStoreName left empty + backup.objectStore.enabled=true).
    barmanCloud:
      enabled: false
      pluginName: barman-cloud.cloudnative-pg.io
      objectStoreName: ""
      recovery:
        enabled: false
        # Recovery initializes a NEW cluster; never enable on the live cluster.
        sourceName: origin
        objectStoreName: ""
        serverName: ""
        targetTime: "" # empty replays to the latest available WAL
    scheduledBackup:
      enabled: false
      # Six-field cron syntax used by CNPG (seconds first): daily at 02:00 UTC.
      schedule: "0 0 2 * * *"
      immediate: true
      backupOwnerReference: self
    # CNPG instance-manager exporter (:9187, pg_* + barman-cloud plugin metrics):
    # render a PodMonitor and the CNPG alert group when metrics.serviceMonitor /
    # metrics.prometheusRule are enabled.
    monitoring:
      enablePodMonitor: true
    database: constellation
    username: constellation
    # Password generated at install time if blank (idempotent across upgrades:
    # the existing Secret is looked up and re-used).
    password: ""

# ---------------------------------------------------------------------------
# Backup object store (opt-in, cnpg mode only)
# ---------------------------------------------------------------------------
# Renders an in-cluster S3-compatible object store (RustFS, single replica on
# one PVC), a Barman Cloud `ObjectStore` CR pointing at it, and a one-shot Job
# that creates the bucket. This replaces the hand-applied manifests formerly in
# deploy/dev/cnpg-rustfs/. It gives a turnkey WAL archive + base backup target
# for development and small installs; it is NOT an off-host recovery target
# (same cluster, same failure domain). Production should point
# postgres.cloudnativepg.barmanCloud.objectStoreName at an ObjectStore backed by
# external, replicated storage instead.
#
# Typical opt-in:
#   backup.objectStore.enabled=true
#   postgres.cloudnativepg.barmanCloud.enabled=true   (objectStoreName stays "")
#   postgres.cloudnativepg.scheduledBackup.enabled=true
backup:
  objectStore:
    enabled: false
    # RustFS server image, pinned by multi-arch index digest.
    # Refresh with: docker buildx imagetools inspect rustfs/rustfs:<ver>
    image: rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
    # Image for the bucket-creation Job (needs /bin/sh + the `aws` CLI).
    # minio/mc is no longer published on a public registry, so amazon/aws-cli
    # is used; pinned by index digest.
    # Refresh with: docker buildx imagetools inspect amazon/aws-cli:<ver>
    bucketJobImage: amazon/aws-cli:2.32.6@sha256:79e492dfe333fe420d41990fa958c673671b44e30877d65a2aed3391033f37dd
    storage: 8Gi
    storageClass: ""        # empty = cluster default
    # Existing Secret with keys ACCESS_KEY_ID and SECRET_ACCESS_KEY. Empty = the
    # chart generates <fullname>-object-store-credentials with random keys and
    # re-uses them on upgrade (lookup-idempotent, resource-policy keep).
    credentialsSecret: ""
    bucket: constellation-recovery
    # Barman Cloud retention for base backups + WAL in this store.
    retentionPolicy: 7d
    # SigV4 signing region advertised to the Barman sidecar / bucket Job.
    region: us-east-1
    resources:
      limits:   { cpu: 1,    memory: 1Gi }
      requests: { cpu: 100m, memory: 256Mi }
  # Off-host copy of the archive (a second failure domain). Renders a second
  # Barman ObjectStore at endpointURL, an rclone CronJob mirroring the local
  # bucket to it every sync.schedule, and (recovery.enabled) a recovery
  # ObjectStore for PITR drills. Credentials: Secret with ACCESS_KEY_ID and
  # SECRET_ACCESS_KEY. docs/cnpg-recovery.md: switch WAL twice before a drill.
  offhost:
    enabled: false
    endpointURL: ""             # e.g. http://backup-host:9000
    bucket: constellation-recovery-offhost
    credentialsSecret: ""
    region: us-east-1
    retentionPolicy: 7d
    sync:
      enabled: true
      schedule: "*/15 * * * *"
      transfers: 4
      checkers: 8
      # Source store to mirror. Empty = the chart-rendered backup.objectStore and
      # server <fullname>-postgres. Set for a store/cluster managed outside this
      # release (postgres.mode=external with an adopted CNPG cluster).
      source:
        endpointURL: ""         # e.g. http://rustfs:9000
        credentialsSecret: ""   # keys ACCESS_KEY_ID, SECRET_ACCESS_KEY
        bucket: ""              # empty = backup.objectStore.bucket
        region: ""
        serverName: ""          # CNPG serverName prefix in the bucket
      resources:
        limits:   { cpu: 1,    memory: 512Mi }
        requests: { cpu: 100m, memory: 128Mi }
    recovery:
      enabled: true
      namespace: ""             # empty = release namespace
  # Daily age-encrypted backup of the namespace's Secrets to an S3 remote
  # (toolbox image: age + kubectl + rclone, non-root).
  secrets:
    enabled: false
    schedule: "15 4 * * *"
    ageRecipient: ""            # age1... public key; keep the identity off-cluster
    namespaces: []              # empty = release namespace
    retentionDays: 30
    remote:
      endpointURL: ""
      bucket: constellation-recovery-offhost
      credentialsSecret: ""
      region: us-east-1
    resources:
      limits:   { cpu: 500m, memory: 256Mi }
      requests: { cpu: 50m,  memory: 64Mi }

# ---------------------------------------------------------------------------
# TLS bootstrap for the admission webhook
# ---------------------------------------------------------------------------
# Two paths:
#   1. certManager.enabled=true       — render Issuer + Certificate, no Job
#   2. bootstrap.enabled=true (default)— pre-install Job mints a self-signed
#                                       CA + server cert and patches the
#                                       ValidatingWebhookConfiguration caBundle
tls:
  certManager:
    enabled: false
    issuer: ""              # name of an existing Issuer/ClusterIssuer
    issuerKind: ClusterIssuer
    # Convenient and correct for the private admission Service certificate.
    # Public ACME issuers cannot issue *.svc names.
    createSelfSignedIssuer: false
  bootstrap:
    enabled: true
    # An image with /bin/sh and Go >= 1.27.3 kubectl. The toolbox bundles
    # both; the chainguard kubectl image is distroless (no shell) so don't use it.
    image: ghcr.io/alphabravo-oss/constellation/toolbox:v0.3.0-rc.3@sha256:87abcb7a07271f509cfaa97d229f87020abeaa60f6eb0d17a20af244fcaee4bb
    opensslImage: alpine/openssl:3.3.2@sha256:5008e829163320a6e8166883c03e68189e8925ade68cde36584dc2a41cfa5248

# ---------------------------------------------------------------------------
# Bootstrap (Job that mints scanner + runtime-agent tokens + default org)
# ---------------------------------------------------------------------------
bootstrap:
  enabled: true
  # Image used by the init container to copy a kubectl binary into a shared
  # volume so the psql container can call kubectl. Must have /bin/sh.
  image: ghcr.io/alphabravo-oss/constellation/toolbox:v0.3.0-rc.3@sha256:87abcb7a07271f509cfaa97d229f87020abeaa60f6eb0d17a20af244fcaee4bb
  # Postgres client image used to seed the org + tokens.
  psqlImage: ghcr.io/alphabravo-oss/constellation/postgres:16.15-v0.3.0-fix.1@sha256:5a15cb2867fe8c5c3df0ff766d5f2019970ec2008a69b9fd27ba94bec767850e
  org:
    name: default
    displayName: Default
# ---------------------------------------------------------------------------
# Init-bundle consumer (Wave N1)
# ---------------------------------------------------------------------------
# When initBundle.secretName is set, the chart switches into "remote cluster"
# mode: the pre-install consumer Job below reads the named Secret (containing
# a `bundle.yaml` key produced by `constellationctl cluster create`) and
# projects its parts into the chart-managed Secrets (constellation-admission-tls,
# constellation-scanner-token, constellation-runtime-agent-token). The
# bootstrap-job + tls-bootstrap-job are short-circuited so no tokens or TLS
# material are re-minted in the new cluster — the control plane is the single
# source of truth.
#
# Operators install with:
#   constellationctl --server https://constellation.example.com cluster create prod-east \
#       --output cluster-init.yaml
#   kubectl create ns constellation-system
#   kubectl -n constellation-system create secret generic constellation-init-bundle \
#       --from-file=bundle.yaml=cluster-init.yaml
#   helm install constellation deploy/charts/constellation \
#       -n constellation-system \
#       --set initBundle.secretName=constellation-init-bundle
initBundle:
  # Empty disables consumer mode (default: chart self-mints via bootstrap-job).
  secretName: ""
  # Image used by the consumer Job — must have /bin/sh + kubectl + yq (or python).
  # The purpose-built toolbox ships with sh but not yq; we shell out to a pure-sed pipeline
  # in the consumer script so a vanilla kubectl image suffices.
  image: ghcr.io/alphabravo-oss/constellation/toolbox:v0.3.0-rc.3@sha256:87abcb7a07271f509cfaa97d229f87020abeaa60f6eb0d17a20af244fcaee4bb

repositoryScans:
  retention:
    # Repository/CI package evidence can grow quickly in active CI systems.
    # This API-side worker prunes old repository scan targets that have no
    # active jobs and no immutable attestation verification history.
    enabled: true
    maxAge: 2160h
    interval: 24h
    batchSize: 500
    dryRun: false

# ---------------------------------------------------------------------------
# Audit archiver (CronJob)
# ---------------------------------------------------------------------------
auditArchiver:
  # Optional scheduled export of the hash-chained audit log to S3. The job uses
  # AWS SDK default credentials, so prefer IRSA/workload identity in production.
  enabled: false
  schedule: "*/5 * * * *"
  bucket: ""
  prefix: "constellation/audit"
  # Each run catches up from the last verified ID, including backdated events.
  batchSize: 1000
  endpoint: ""
  awsRegion: ""
  sign:
    # static-key | keyless. Durable progress requires a trusted signature.
    # static-key uses an ed25519 PEM private key
    # compatible with `constellationctl backup gen-key`; keyless shells out to
    # cosign and requires an ambient OIDC token.
    mode: static-key
    keySecretName: ""
    keySecretKey: cosign.key
    verifySecretKey: cosign.pub
    keyPath: ""
    verifyKeyPath: ""
    verifyIdentity: ""
    cosignBin: cosign
  env: []
  # - name: AWS_ENDPOINT_URL_S3
  #   value: https://s3.us-gov-west-1.amazonaws.com

# Optional shared identity layer. Local accounts remain enabled independently.
# Set identity.zitadel.zitadel.configmapConfig.ExternalDomain and ingress TLS for
# this install. Registry URLs are rendered by the identity chart from that host.
identity:
  enabled: false
  secretPrefix: constellation-identity-product-
  ingress:
    className: nginx
    tlsSecretName: constellation-tls
  networkPolicy:
    ingressPeers:
      - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}
        podSelector: {matchLabels: {app.kubernetes.io/name: ingress-nginx}}
    ingressPorts: [{port: 443}, {port: 80}]
  products:
    - slug: constellation
      displayName: Constellation
      branding:
        Accent: '#0d9488'
        AccentDark: '#2dd4bf'
        Logo: 'https://{{ .Values.zitadel.zitadel.configmapConfig.ExternalDomain }}/icon.svg'
      roles: [security-admin, analyst]
      redirectURIs:
        - 'https://{{ .Values.zitadel.zitadel.configmapConfig.ExternalDomain }}/api/v1/auth/oidc/callback'
      groupRoles:
        security-admin: [security-admin]
        analyst: [analyst]

# Human authentication. Local and OIDC can be enabled independently.
# Values seed settings; later changes to these values replace the saved policy.
auth:
  local:
    enabled: true
    display: all # all, local, or sso; controls the normal login choices
    totpPolicy: everyone # everyone or admins
    passwordMinLength: 16
    sessionSeconds: 3600
    ipRate: 20 # attempts per minute, shared across replicas
    accountRate: 5 # failures before exponential backoff (1 second to 5 minutes)
    orgName: default
    bootstrap:
      enabled: true
      email: admin@constellation.local
      existingSecret: "" # password and totp-secret; generated if empty
  oidc:
    enabled: false
    issuerURL: ""
    clientID: ""
    clientSecretName: "" # key: client-secret; empty for a public PKCE client
    audience: "" # defaults to clientID
    redirectURL: "" # https://<public-host>/api/v1/auth/oidc/callback
    rolesClaim: alphabravo_roles
    roleMapping: {} # exact claim value -> canonical product role; no fallback grant
    orgName: default
    scopes: [openid, email, profile]
  breakGlass:
    enabled: false
    existingSecret: "" # required when enabled; keys: password-hash, totp-secret
    orgName: default
    sessionTTL: 5m

# ---------------------------------------------------------------------------
# Abbot GenAI integration (off by default)
# ---------------------------------------------------------------------------
ai:
  enabled: false
  serviceURL: ""

# ---------------------------------------------------------------------------
# FIPS mode (use FIPS-validated base image for all role binaries)
# ---------------------------------------------------------------------------
fips:
  enabled: false
  registry: ghcr.io/alphabravo-oss/constellation-fips

# ---------------------------------------------------------------------------
# Namespacing
# ---------------------------------------------------------------------------
# Single-namespace install. When true, the operator watches and reconciles
# namespaced workloads only in the release namespace and gets a namespaced Role
# for those resources. ConstellationCluster CR access stays cluster-scoped
# because the CRD itself is cluster-scoped. Set false for cluster-wide workload
# reconciliation.
namespaced: true

# Scheduled compliance reports. Provision durable shared storage and a Cosign key
# Secret before enabling. The API mounts reports read-only; only the scheduler
# receives the private signing key. ReadWriteOnce colocates the scheduler with API.
complianceScheduler:
  enabled: false
  image: {}
  interval: 30s
  storage:
    existingClaim: ""
    accessMode: ReadWriteOnce
  signingSecret: "" # keys: cosign.key and password
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
