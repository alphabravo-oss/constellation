# TODO(matrix): SCAFFOLD — this CRD ships so compliance exemptions can be declared in GitOps,
# but the operator reconciler is NOT yet wired (no controller reads it). Unlike the other policy
# kinds the compliance_exemptions table (migration 056) has no (org_id, name) uniqueness to key an
# idempotent upsert on, so finishing this domain needs either a name/source column (an app
# migration, out of scope for the operator-crds subsystem) or a synthetic-identity reconcile
# strategy. See deploy/operator/api/v1alpha1/policy_matrix_types.go for the matching TODO(matrix).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: constellationcomplianceexemptions.constellation.alphabravo.io
spec:
  group: constellation.alphabravo.io
  scope: Cluster
  names:
    kind: ConstellationComplianceExemption
    listKind: ConstellationComplianceExemptionList
    plural: constellationcomplianceexemptions
    singular: constellationcomplianceexemption
    shortNames: [cce]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Framework
          type: string
          jsonPath: .spec.framework
        - name: Control
          type: string
          jsonPath: .spec.controlID
        - name: Phase
          type: string
          jsonPath: .status.phase
      schema:
        openAPIV3Schema:
          # Spec mirrors a `compliance_exemptions` row (migration 056): a time-boxed control waiver.
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [orgID, framework, controlID, reason, expiresAt]
              properties:
                orgID:
                  type: string
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: "orgID is immutable"
                clusterID: { type: string }
                framework: { type: string }
                controlID: { type: string }
                reason:    { type: string }
                expiresAt: { type: string, format: date-time }
            status:
              type: object
              properties:
                phase: { type: string }
                observedGeneration: { type: integer, format: int64 }
                lastAppliedOrgID: { type: string }
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, lastTransitionTime, reason, message]
                    properties:
                      type:               { type: string }
                      status:             { type: string }
                      observedGeneration: { type: integer, format: int64 }
                      lastTransitionTime: { type: string, format: date-time }
                      reason:             { type: string }
                      message:            { type: string }
