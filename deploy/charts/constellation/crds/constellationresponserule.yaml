apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: constellationresponserules.constellation.alphabravo.io
spec:
  group: constellation.alphabravo.io
  scope: Cluster
  names:
    kind: ConstellationResponseRule
    listKind: ConstellationResponseRuleList
    plural: constellationresponserules
    singular: constellationresponserule
    shortNames: [crr]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Event
          type: string
          jsonPath: .spec.eventType
        - name: Priority
          type: integer
          jsonPath: .spec.priority
        - name: Enabled
          type: boolean
          jsonPath: .spec.enabled
        - name: Phase
          type: string
          jsonPath: .status.phase
      schema:
        openAPIV3Schema:
          # Spec mirrors a `response_rules` row (migration 103, E1 CLUSResponseRule parity).
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [orgID, eventType, actions]
              properties:
                orgID:
                  type: string
                  # orgID is part of the backing row's identity (response_rules.org_id, name).
                  # Editing it would write a new-org row and orphan the original, so it is immutable:
                  # change the owning org by deleting and recreating the CR.
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: "orgID is immutable"
                enabled: { type: boolean }
                priority:
                  type: integer
                  format: int64
                eventType:
                  type: string
                  enum: [process, file, network, admission, scan]
                conditions:
                  type: array
                  items:
                    type: object
                    required: [field, op, value]
                    properties:
                      field: { type: string }
                      op:
                        type: string
                        enum: [eq, ne, contains, regex, gt, lt]
                      value: { type: string }
                actions:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [type]
                    properties:
                      type:
                        type: string
                        enum: [quarantine, suppress_log, webhook, tag]
                      params:
                        type: object
                        additionalProperties: { type: string }
            status:
              type: object
              properties:
                phase: { type: string }
                observedGeneration: { type: integer, format: int64 }
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, lastTransitionTime, reason, message]
                    properties:
                      type:               { type: string }
                      status:             { type: string }
                      observedGeneration: { type: integer, format: int64 }
                      lastTransitionTime: { type: string, format: date-time }
                      reason:             { type: string }
                      message:            { type: string }
