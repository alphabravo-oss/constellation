apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: constellationclusters.constellation.alphabravo.io
spec:
  group: constellation.alphabravo.io
  scope: Cluster
  names:
    kind: ConstellationCluster
    listKind: ConstellationClusterList
    plural: constellationclusters
    singular: constellationcluster
    shortNames: [cc]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Scanner
          type: boolean
          jsonPath: .spec.scannerEnabled
        - name: Admission
          type: boolean
          jsonPath: .spec.admissionEnabled
        - name: Runtime
          type: boolean
          jsonPath: .spec.runtimeEnabled
        - name: Phase
          type: string
          jsonPath: .status.phase
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [controlPlaneURL, orgID]
              properties:
                controlPlaneURL: { type: string }
                orgID:            { type: string }
                scannerEnabled:   { type: boolean }
                admissionEnabled: { type: boolean }
                runtimeEnabled:   { type: boolean }
                agentImage:       { type: string }
                scannerImage:     { type: string }
                admissionImage:   { type: string }
                runtimeAgentImage: { type: string }
                scannerReplicas:   { type: integer, format: int32 }
                admissionReplicas: { type: integer, format: int32 }
                scannerAutoscale:
                  type: object
                  properties:
                    enabled: { type: boolean }
                    minReplicas: { type: integer, format: int32 }
                    maxReplicas: { type: integer, format: int32 }
                    targetCPUUtilization: { type: integer, format: int32 }
                agentResources:
                  type: object
                  properties:
                    cpuLimit:    { type: string }
                    memoryLimit: { type: string }
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
