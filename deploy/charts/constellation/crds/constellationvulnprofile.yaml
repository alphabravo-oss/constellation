apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: constellationvulnprofiles.constellation.alphabravo.io
spec:
  group: constellation.alphabravo.io
  scope: Cluster
  names:
    kind: ConstellationVulnProfile
    listKind: ConstellationVulnProfileList
    plural: constellationvulnprofiles
    singular: constellationvulnprofile
    shortNames: [cvp]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Active
          type: boolean
          jsonPath: .spec.active
        - name: Phase
          type: string
          jsonPath: .status.phase
      schema:
        openAPIV3Schema:
          # Spec mirrors a `vuln_profiles` row (migration 022, vulnerability exception profile).
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [orgID]
              properties:
                orgID:
                  type: string
                  # orgID is part of the backing row's identity (vuln_profiles.org_id, name).
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: "orgID is immutable"
                description: { type: string }
                # active defaults false — a profile only alters vuln scoring once activated.
                active: { type: boolean }
                entries:
                  type: array
                  items:
                    type: object
                    required: [name, action]
                    properties:
                      name:      { type: string }
                      nameRegex: { type: string }
                      images:
                        type: array
                        items: { type: string }
                      action:
                        type: string
                        enum: [suppress, escalate]
                      daysToFix: { type: integer }
                      severityFloor:
                        type: string
                        enum: [low, medium, high, critical]
                      scoreFloor: { type: number }
                      reserved:  { type: string }
                      recentDays: { type: integer }
                      comment:   { type: string }
                domainScope:
                  type: object
                  properties:
                    clusters:
                      type: array
                      items: { type: string }
                    namespaces:
                      type: array
                      items: { type: string }
            status:
              type: object
              properties:
                phase: { type: string }
                observedGeneration: { type: integer, format: int64 }
                lastAppliedOrgID: { type: string }
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, lastTransitionTime, reason, message]
                    properties:
                      type:               { type: string }
                      status:             { type: string }
                      observedGeneration: { type: integer, format: int64 }
                      lastTransitionTime: { type: string, format: date-time }
                      reason:             { type: string }
                      message:            { type: string }
