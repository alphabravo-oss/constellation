apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: constellationadmissionrules.constellation.alphabravo.io
spec:
  group: constellation.alphabravo.io
  scope: Cluster
  names:
    kind: ConstellationAdmissionRule
    listKind: ConstellationAdmissionRuleList
    plural: constellationadmissionrules
    singular: constellationadmissionrule
    shortNames: [car]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Engine
          type: string
          jsonPath: .spec.engine
        - name: Mode
          type: string
          jsonPath: .spec.mode
        - name: Enabled
          type: boolean
          jsonPath: .spec.enabled
        - name: Phase
          type: string
          jsonPath: .status.phase
      schema:
        openAPIV3Schema:
          # Spec mirrors a `policies` row of category="admission" (migration 006).
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [orgID, mode, specYAML]
              properties:
                orgID:
                  type: string
                  # orgID is part of the backing row's identity (policies.org_id, name). Editing it
                  # would write a new-org row and orphan the original, so it is immutable: change the
                  # owning org by deleting and recreating the CR.
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: "orgID is immutable"
                description: { type: string }
                engine:
                  type: string
                  enum: [kyverno, opa-rego, k8s-cel, internal-waf, internal-dlp, internal-license]
                mode:
                  type: string
                  enum: [learn, monitor, enforce]
                enabled:  { type: boolean }
                specYAML: { type: string }
            status:
              type: object
              properties:
                phase: { type: string }
                observedGeneration: { type: integer, format: int64 }
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, lastTransitionTime, reason, message]
                    properties:
                      type:               { type: string }
                      status:             { type: string }
                      observedGeneration: { type: integer, format: int64 }
                      lastTransitionTime: { type: string, format: date-time }
                      reason:             { type: string }
                      message:            { type: string }
