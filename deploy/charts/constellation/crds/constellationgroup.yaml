apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: constellationgroups.constellation.alphabravo.io
spec:
  group: constellation.alphabravo.io
  scope: Cluster
  names:
    kind: ConstellationGroup
    listKind: ConstellationGroupList
    plural: constellationgroups
    singular: constellationgroup
    shortNames: [cgrp]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Kind
          type: string
          jsonPath: .spec.kind
        - name: PolicyMode
          type: string
          jsonPath: .spec.policyMode
        - name: ProfileMode
          type: string
          jsonPath: .spec.profileMode
        - name: Phase
          type: string
          jsonPath: .status.phase
      schema:
        openAPIV3Schema:
          # Spec mirrors a `groups` row (migrations 023/031/088) — a NeuVector-style workload
          # selector plus its policy/profile modes. Members are server-computed and not part of spec.
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [orgID]
              properties:
                orgID:
                  type: string
                  # orgID + metadata.name are the backing row's identity (groups.org_id, name). Immutable.
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: "orgID is immutable"
                kind:
                  type: string
                  enum: [learned, ground, federated]
                comment:
                  type: string
                criteria:
                  type: array
                  items:
                    type: object
                    required: [key, value]
                    properties:
                      key:   { type: string }
                      value: { type: string }
                      op:
                        type: string
                        enum: ["", eq, contains, regex]
                # SAFETY: modes default to "monitor" (observe, never block). "protect" is opt-in.
                policyMode:
                  type: string
                  enum: [discover, monitor, protect]
                profileMode:
                  type: string
                  enum: [discover, monitor, protect]
            status:
              type: object
              properties:
                phase: { type: string }
                observedGeneration: { type: integer, format: int64 }
                lastAppliedOrgID: { type: string }
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, lastTransitionTime, reason, message]
                    properties:
                      type:               { type: string }
                      status:             { type: string }
                      observedGeneration: { type: integer, format: int64 }
                      lastTransitionTime: { type: string, format: date-time }
                      reason:             { type: string }
                      message:            { type: string }
