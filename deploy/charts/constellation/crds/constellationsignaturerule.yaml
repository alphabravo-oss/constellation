apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: constellationsignaturerules.constellation.alphabravo.io
spec:
  group: constellation.alphabravo.io
  scope: Cluster
  names:
    kind: ConstellationSignatureRule
    listKind: ConstellationSignatureRuleList
    plural: constellationsignaturerules
    singular: constellationsignaturerule
    shortNames: [csig]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Cluster
          type: string
          jsonPath: .spec.clusterID
        - name: Mode
          type: string
          jsonPath: .spec.mode
        - name: Phase
          type: string
          jsonPath: .status.phase
      schema:
        openAPIV3Schema:
          # Spec mirrors a `runtime_dlp_rules` row of category='signature' (migrations 044/046),
          # the DPI/L7 signature surface that replaced the removed WAF-groups CRUD.
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [orgID, clusterID, patterns]
              properties:
                orgID:
                  type: string
                  # orgID + clusterID are part of the backing row's identity
                  # (runtime_dlp_rules.org_id, cluster_id, name). Both immutable.
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: "orgID is immutable"
                clusterID:
                  type: string
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: "clusterID is immutable"
                # SAFETY: mode defaults to "monitor" (dp observes, never drops the connection).
                # "enforce" is honoured only when explicitly declared here.
                mode:
                  type: string
                  enum: [monitor, enforce, disabled]
                severity:
                  type: integer
                  minimum: 1
                  maximum: 9
                applyDir:
                  type: integer
                  enum: [1, 2, 3]   # 1=egress, 2=ingress, 3=both
                patterns:
                  type: array
                  minItems: 1
                  items: { type: string }
                description: { type: string }
            status:
              type: object
              properties:
                phase: { type: string }
                observedGeneration: { type: integer, format: int64 }
                lastAppliedOrgID: { type: string }
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, lastTransitionTime, reason, message]
                    properties:
                      type:               { type: string }
                      status:             { type: string }
                      observedGeneration: { type: integer, format: int64 }
                      lastTransitionTime: { type: string, format: date-time }
                      reason:             { type: string }
                      message:            { type: string }
