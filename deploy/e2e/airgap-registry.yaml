# Cluster-local OCI registry for the air-gap e2e: the scan source the scanner
# reaches over plain HTTP (scanner.insecureRegistries). Image comes from the
# loaded bundle (pullPolicy Never).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airgap-registry
  labels: { app.kubernetes.io/name: airgap-registry }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: airgap-registry } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: airgap-registry }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: registry
          image: docker.io/library/registry:2.8.3
          imagePullPolicy: Never
          env: [{ name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true" }]
          ports: [{ name: http, containerPort: 5000 }]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: data, mountPath: /var/lib/registry }]
      volumes: [{ name: data, emptyDir: { sizeLimit: 2Gi } }]
---
apiVersion: v1
kind: Service
metadata: { name: airgap-registry }
spec:
  selector: { app.kubernetes.io/name: airgap-registry }
  ports: [{ name: http, port: 5000, targetPort: http }]
---
# default-deny is in force: admit the scanner (and port-forward from the node) to the registry only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: airgap-registry }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: airgap-registry } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/component: scanner } }
        - ipBlock: { cidr: 10.42.0.0/16 }
        - ipBlock: { cidr: 5.78.190.70/32 }
      ports: [{ protocol: TCP, port: 5000 }]
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: scanner-to-airgap-registry }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/component: scanner } }
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: airgap-registry } } }]
      ports: [{ protocol: TCP, port: 5000 }]
