apiVersion: v1
kind: Namespace
metadata:
  name: perf-bench
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortio-server
  namespace: perf-bench
spec:
  replicas: 1
  selector: { matchLabels: { app: fortio-server } }
  template:
    metadata:
      labels: { app: fortio-server }
    spec:
      containers:
        - name: fortio
          image: fortio/fortio:latest
          imagePullPolicy: IfNotPresent
          args: ["server", "-http-port", "8080"]
          ports:
            - { containerPort: 8080, name: http }
          resources:
            requests: { cpu: 500m, memory: 256Mi }
            limits:   { cpu: 2,    memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: fortio-server
  namespace: perf-bench
spec:
  selector: { app: fortio-server }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
