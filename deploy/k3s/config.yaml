# /etc/rancher/k3s/config.yaml profile for a single-node or small k3s host
# running Constellation (docs/k3s-profile.md). Kubelet eviction and image-GC
# thresholds are explicit: on k3s the containerd image store, the kubelet
# imagefs and every local-path PV share the root filesystem, so the defaults
# (GC at 85%, hard eviction at 10% free) let a scanner DB refresh or a backup
# push the node into DiskPressure. `image-minimum-gc-age` is no longer a
# kubelet flag; the thresholds below are the supported knobs.
kubelet-arg:
  - "eviction-hard=memory.available<500Mi,nodefs.available<10%,nodefs.inodesFree<5%,imagefs.available<15%"
  - "eviction-soft=memory.available<1Gi,nodefs.available<15%,imagefs.available<20%"
  - "eviction-soft-grace-period=memory.available=2m,nodefs.available=5m,imagefs.available=5m"
  - "eviction-minimum-reclaim=nodefs.available=2Gi,imagefs.available=5Gi"
  - "image-gc-high-threshold=80"
  - "image-gc-low-threshold=65"
kube-apiserver-arg:
  - "admission-control-config-file=/etc/rancher/k3s/psa-admission.yaml"
