# Constellation C1 — audit-webhook backend kubeconfig (template).
#
# Passed to the API server via --audit-webhook-config-file (see README.md). The
# API server POSTs batches of audit.k8s.io/v1 Events (kind: EventList) to the
# `server` URL below, sending the `user.token` as `Authorization: Bearer <token>`.
#
# Auth: the ingest route POST /api/v1/k8s-audit:bulk is guarded by
# RuntimeAgentTokenMiddleware, so `token` MUST be a valid runtime-agent / cluster
# token (the same credential the Constellation DaemonSet agent uses).
#
# server URL: the in-cluster API Service <release>-api on port 8080 (plain HTTP),
# with the exact ingest path /api/v1/k8s-audit:bulk. Adjust the release name and
# namespace to match your install. NOTE: kube-apiserver runs on the control-plane
# host network and often cannot resolve cluster Service DNS — see README.md for
# the ClusterIP / NodePort / ingress / hostAliases options.
apiVersion: v1
kind: Config
clusters:
  - name: constellation
    cluster:
      # <release>-api.<namespace>.svc.cluster.local:<api.service.port>
      server: "http://constellation-api.constellation.svc.cluster.local:8080/api/v1/k8s-audit:bulk"
      # If you front the API with TLS (ingress) instead of the plain-HTTP Service,
      # use an https:// server and supply the CA:
      #   certificate-authority-data: <base64 PEM CA>
      # or (dev only) insecure-skip-tls-verify: true
users:
  - name: constellation-audit-webhook
    user:
      # Runtime-agent / cluster bearer token. Replace with the real token value
      # (e.g. from the cluster init-bundle / runtime-agent token secret).
      token: "REPLACE_WITH_RUNTIME_AGENT_TOKEN"
contexts:
  - name: constellation
    context:
      cluster: constellation
      user: constellation-audit-webhook
current-context: constellation
