# Isolated local recovery rehearsal only. No ingress or public S3 credentials.
apiVersion: v1
kind: Service
metadata:
  name: rustfs
spec:
  selector: {app: rustfs}
  ports:
    - {name: s3, port: 9000, targetPort: 9000}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rustfs
spec:
  serviceName: rustfs
  replicas: 1
  selector:
    matchLabels: {app: rustfs}
  template:
    metadata:
      labels: {app: rustfs}
    spec:
      securityContext: {runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.1
          args: ["/data"]
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: rustfs-credentials, key: ACCESS_KEY_ID}}
            - name: RUSTFS_SECRET_KEY
              valueFrom: {secretKeyRef: {name: rustfs-credentials, key: SECRET_ACCESS_KEY}}
            - {name: RUSTFS_ADDRESS, value: ":9000"}
            - {name: RUSTFS_CONSOLE_ENABLE, value: "false"}
            - {name: RUSTFS_OBS_LOGGER_LEVEL, value: "warn"}
            - {name: RUSTFS_OBS_LOG_DIRECTORY, value: "/tmp/rustfs-logs"}
          ports: [{name: s3, containerPort: 9000}]
          readinessProbe:
            httpGet: {path: /health, port: s3}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "2", memory: 2Gi}
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 8Gi}
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: rustfs-archive
spec:
  retentionPolicy: "7d"
  configuration:
    destinationPath: s3://constellation-recovery/
    endpointURL: http://rustfs:9000
    s3Credentials:
      accessKeyId: {name: rustfs-credentials, key: ACCESS_KEY_ID}
      secretAccessKey: {name: rustfs-credentials, key: SECRET_ACCESS_KEY}
    wal: {compression: gzip, maxParallel: 2}
    data: {compression: gzip, jobs: 2}
  instanceSidecarConfiguration:
    env:
      - {name: AWS_DEFAULT_REGION, value: us-east-1}
