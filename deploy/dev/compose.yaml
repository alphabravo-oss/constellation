# Dev-only backing services: Postgres (pgvector) and the observability stack.
# Application binaries run on the host through Air (scripts/dev.sh); this file never
# runs application containers. Helm is the only deployment path (ADR 0007).
name: constellation-dev
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${DEV_PG_USER:-constellation}
      POSTGRES_PASSWORD: ${DEV_PG_PASSWORD:-constellation}
      POSTGRES_DB: ${DEV_PG_DB:-constellation}
    ports:
      - "${DEV_PG_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DEV_PG_USER:-constellation} -d ${DEV_PG_DB:-constellation}"]
      interval: 2s
      timeout: 3s
      retries: 30

  prometheus:
    image: prom/prometheus:v3.15.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d", "--web.enable-otlp-receiver"]
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  tempo:
    image: grafana/tempo:3.1.0
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo:/var/tempo

  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/loki.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki.yaml:/etc/loki/loki.yaml:ro
      - loki:/loki

  # Ships the Air/Vite log files (tmp/dev/logs) into Loki so the request-summary
  # line is queryable by correlation_id (see observability/alloy.alloy).
  alloy:
    image: grafana/alloy:v1.13.0
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    ports:
      - "12345:12345"
    volumes:
      - ./observability/alloy.alloy:/etc/alloy/config.alloy:ro
      - ../../tmp/dev/logs:/var/log/constellation:ro
      - alloy:/var/lib/alloy/data
    depends_on: [loki]

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [prometheus, tempo, loki]

volumes:
  pgdata: {}
  tempo: {}
  loki: {}
  alloy: {}
