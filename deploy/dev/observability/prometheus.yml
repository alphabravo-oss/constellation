# Scrapes every dev binary's admin/metrics port on the host. Bind-mounted so a new
# target is a one-line edit, no image rebuild.
global:
  scrape_interval: 10s
scrape_configs:
  - job_name: constellation-api
    static_configs:
      - targets: ["host.docker.internal:18081"]
  - job_name: constellation-operator
    static_configs:
      - targets: ["host.docker.internal:18082"]
  - job_name: constellation-scanner
    static_configs:
      - targets: ["host.docker.internal:18084"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
