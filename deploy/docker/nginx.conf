# nginx config for the Constellation frontend image. SPA-style routing + /api passthrough.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: every unknown route falls back to index.html so React Router owns navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite build output under /assets/ is content-hashed → safe to cache immutably.
    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    # Stable-named static files (favicon, logos, icons) — revalidate so replacing
    # them actually reaches browsers instead of sticking in the immutable cache.
    location ~* \.(?:svg|png|ico|jpg|jpeg|gif|webp|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # API + OpenAPI passthrough. CONSTELLATION_API_URL is templated at deploy time by the
    # Helm chart; for local docker-compose use it points at the constellation-api service.
    location /api/ {
        proxy_pass http://constellation-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Stream API responses straight to the client — do NOT buffer. The image runs on a
        # read-only rootfs, so once a response outgrows the in-memory proxy buffers nginx
        # tries to spill to a temp file it cannot write and TRUNCATES the body (HTTP 200,
        # cut-off JSON) — which blanked large lists like /findings. Streaming needs no
        # temp file. Generous timeouts so big/slow reports still complete.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location /openapi.json {
        proxy_pass http://constellation-api:8080;
    }
    location /healthz { return 200; }
}
