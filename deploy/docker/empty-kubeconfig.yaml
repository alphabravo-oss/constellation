# Placeholder kubeconfig that ships with the repo so docker-compose can RO-bind a known
# path into the discoverer container even when no real cluster is configured.
#
# The discoverer entrypoint checks for $KUBECONFIG file presence and skips reconciliation
# when this empty sentinel is mounted. Override with
# KUBECONFIG_HOST_PATH=/path/to/real on the host to point at a real kubeconfig.
#
# Do NOT use this file as a real kubeconfig — it intentionally has no cluster/server entry.
apiVersion: v1
kind: Config
clusters: []
contexts: []
users: []
