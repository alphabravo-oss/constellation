name: Scanner lease candidates

on:
  workflow_dispatch:
    inputs:
      role:
        description: Image role to build
        type: choice
        default: all
        options: [all, api, scanner, migrate]
  push:
    branches: [main, 'implement/**']
    paths:
      - deploy/dev/lease-validation/Dockerfile.migrate

permissions:
  contents: read

concurrency:
  group: scanner-lease-candidates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        role: ${{ inputs.role == 'api' && fromJSON('["api"]') || inputs.role == 'scanner' && fromJSON('["scanner"]') || inputs.role == 'migrate' && fromJSON('["migrate"]') || fromJSON('["api","scanner","migrate"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Record build time
        id: time
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build source-stamped OCI candidate
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.role == 'migrate' && 'deploy/dev/lease-validation/Dockerfile.migrate' || format('deploy/docker/Dockerfile.{0}', matrix.role) }}
          platforms: linux/amd64
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          tags: constellation/${{ matrix.role }}:candidate-${{ github.sha }}
          build-args: |
            VERSION=dev-${{ github.sha }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.time.outputs.value }}
          provenance: mode=max
          sbom: true
      - name: Record build identity
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          IMAGE_ROLE: ${{ matrix.role }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          evidence = {
              'sourceCommit': os.environ['SOURCE_COMMIT'],
              'role': os.environ['IMAGE_ROLE'],
              'digest': os.environ['IMAGE_DIGEST'],
              'metadata': json.loads(os.environ['BUILD_METADATA']),
          }
          pathlib.Path(os.environ['RUNNER_TEMP'], 'identity.json').write_text(json.dumps(evidence, indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scanner-lease-${{ matrix.role }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/image.tar
            ${{ runner.temp }}/identity.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
