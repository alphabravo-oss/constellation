name: Scanner lease candidates

on:
  workflow_dispatch:
    inputs:
      role:
        description: Image role to build
        type: choice
        default: all
        options: [all, api, scanner, migrate]
  push:
    branches: [main, 'implement/**']
    paths:
      - deploy/dev/lease-validation/Dockerfile.migrate
      - deploy/docker/goose/**

permissions:
  contents: read

concurrency:
  group: scanner-lease-candidates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        role: ${{ github.event_name == 'push' && fromJSON('["migrate"]') || inputs.role == 'api' && fromJSON('["api"]') || inputs.role == 'scanner' && fromJSON('["scanner"]') || inputs.role == 'migrate' && fromJSON('["migrate"]') || fromJSON('["api","scanner","migrate"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Record build time
        id: time
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build source-stamped OCI candidate
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.role == 'migrate' && 'deploy/dev/lease-validation/Dockerfile.migrate' || format('deploy/docker/Dockerfile.{0}', matrix.role) }}
          platforms: linux/amd64
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          tags: constellation/${{ matrix.role }}:candidate-${{ github.sha }}
          build-args: |
            VERSION=dev-${{ github.sha }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.time.outputs.value }}
          provenance: mode=max
          sbom: true
      - name: Validate migration runtime against a disposable database
        if: matrix.role == 'migrate'
        env:
          CANDIDATE: constellation/migrate:candidate-${{ github.sha }}
        run: |
          set -euo pipefail
          docker load -i "$RUNNER_TEMP/image.tar"
          docker network create migration-validation
          trap 'docker rm -f migration-validation-db >/dev/null; docker network rm migration-validation >/dev/null' EXIT
          docker run -d --name migration-validation-db --network migration-validation \
            -e POSTGRES_USER=test -e POSTGRES_PASSWORD=test -e POSTGRES_DB=constellation_test \
            pgvector/pgvector:pg16
          ready=false
          for attempt in {1..60}; do
            if docker exec migration-validation-db pg_isready -U test -d constellation_test; then ready=true; break; fi
            sleep 1
          done
          "$ready"
          database_url='postgres://test:test@migration-validation-db:5432/constellation_test?sslmode=disable'
          for attempt in 1 2; do
            echo "Validating migration pass $attempt"
            docker run --rm --network migration-validation --read-only --cap-drop ALL \
              --user 10001:10001 -e DATABASE_URL="$database_url" "$CANDIDATE"
          done
          test "$(docker exec migration-validation-db psql -U test -d constellation_test -Atc \
            "SELECT max(version_id) FROM goose_db_version WHERE is_applied")" = 184
          docker run --rm --network migration-validation --read-only --cap-drop ALL \
            --user 10001:10001 --entrypoint /usr/local/bin/goose \
            -e GOOSE_DRIVER=postgres -e GOOSE_DBSTRING="$database_url" -e GOOSE_MIGRATION_DIR=/migrations \
            "$CANDIDATE" down
          test "$(docker exec migration-validation-db psql -U test -d constellation_test -Atc \
            "SELECT count(*) FROM information_schema.columns WHERE table_name='scan_jobs' AND column_name='lease_id'")" = 0
          docker run --rm --network migration-validation --read-only --cap-drop ALL \
            --user 10001:10001 -e DATABASE_URL="$database_url" "$CANDIDATE"
          test "$(docker exec migration-validation-db psql -U test -d constellation_test -Atc \
            "SELECT count(*) FROM information_schema.columns WHERE table_name='scan_jobs' AND column_name='lease_id' AND data_type='uuid'")" = 1
      - name: Record build identity
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          IMAGE_ROLE: ${{ matrix.role }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          evidence = {
              'sourceCommit': os.environ['SOURCE_COMMIT'],
              'role': os.environ['IMAGE_ROLE'],
              'digest': os.environ['IMAGE_DIGEST'],
              'metadata': json.loads(os.environ['BUILD_METADATA']),
          }
          pathlib.Path(os.environ['RUNNER_TEMP'], 'identity.json').write_text(json.dumps(evidence, indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scanner-lease-${{ matrix.role }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/image.tar
            ${{ runner.temp }}/identity.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
