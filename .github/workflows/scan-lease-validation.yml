name: Scan lease validation
on:
  workflow_dispatch:
  push:
    branches: [main, 'implement/**']
    paths:
      - .github/workflows/scan-lease-validation.yml
      - pkg/scanlease/**
      - internal/scanner/**
      - cmd/constellation-scanner/**
      - internal/handler/scanning/**
      - internal/handler/registry_credentials*
      - internal/db/schema.go
      - internal/server/database/migrations/184_scan_job_lease_identity.sql
permissions:
  contents: read
concurrency:
  group: scan-lease-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: bash scripts/install-ci-tools.sh goose gotestsum
      - name: Database-backed lease and worker regression suite
        run: |
          make test-integration PKG="./internal/handler/scanning ./internal/handler ./cmd/constellation-scanner ./pkg/scanlease ./internal/db ./internal/scanner"
      - name: Compile actual-tool acceptance helper
        run: GOWORK=off go test -c -o artifacts/scanner.test ./internal/scanner
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-lease-regression-${{ github.sha }}
          path: artifacts/
          retention-days: 7
