name: Scanner tool validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/scanner-tool-validation.yml
      - deploy/docker/scanner-tools/grype/**
      - deploy/docker/scanner-tools/sources.json
      - cmd/tools/scanner-tools/**
      - go.mod
      - go.sum
  push:
    branches: [main, 'implement/**']
    paths:
      - .github/workflows/scanner-tool-validation.yml
      - deploy/docker/scanner-tools/grype/**
      - deploy/docker/scanner-tools/sources.json
      - cmd/tools/scanner-tools/**
      - go.mod
      - go.sum
permissions:
  contents: read
concurrency:
  group: scanner-tool-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Prepare checksum-verified patched Grype source
        run: |
          go run ./cmd/tools/scanner-tools --tool grype --prepare-only --work "$RUNNER_TEMP/grype-source" --output "$RUNNER_TEMP/tool-output"
          cp deploy/docker/scanner-tools/grype/completion_security_test.go "$RUNNER_TEMP/grype-source/grype/cmd/grype/cli/commands/constellation_completion_test.go"
      - name: Validate runtime dependency graph and completion behavior
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cd "$RUNNER_TEMP/grype-source/grype"
          GOWORK=off go list -mod=readonly -tags containers_image_openpgp,exclude_graphdriver_btrfs -deps ./cmd/grype > "$GITHUB_WORKSPACE/artifacts/grype-dependencies.txt"
          if grep -q '^github.com/docker/docker/' "$GITHUB_WORKSPACE/artifacts/grype-dependencies.txt"; then
            echo 'Retired Docker module remains in the runtime graph'
            exit 1
          fi
          grep -qx 'github.com/moby/moby/client' "$GITHUB_WORKSPACE/artifacts/grype-dependencies.txt"
          GOWORK=off go test -mod=readonly -race -shuffle=on -count=2 -json ./cmd/grype/cli/commands ./internal/format | tee "$GITHUB_WORKSPACE/artifacts/grype-tests.json"
      - name: Validate the release-built Grype executable
        run: |
          go run ./cmd/tools/scanner-tools --tool grype --work "$RUNNER_TEMP/grype-source" --output "$RUNNER_TEMP/tool-output"
          go version -m "$RUNNER_TEMP/tool-output/grype" > artifacts/grype-buildinfo.txt
          "$RUNNER_TEMP/tool-output/grype" version -o json > artifacts/grype-version.json
          CONSTELLATION_TEST_GRYPE_BINARY="$RUNNER_TEMP/tool-output/grype" \
            go test -race -shuffle=on -count=2 -json ./cmd/tools/scanner-tools -run '^TestGrypeBinary$' | tee artifacts/grype-binary-tests.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scanner-tool-regression-${{ github.sha }}
          path: artifacts/
          retention-days: 7
