name: Frontend candidate

on:
  workflow_dispatch:
  push:
    branches: [main, 'implement/**']
    paths:
      - frontend/**
      - deploy/docker/Dockerfile.frontend
      - deploy/docker/nginx.conf
      - .github/workflows/frontend-candidate.yml

permissions:
  contents: read

concurrency:
  group: frontend-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run test:ci
        working-directory: frontend
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Record build time
        id: time
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build source-stamped OCI candidate
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile.frontend
          platforms: linux/amd64
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          tags: constellation/frontend:candidate-${{ github.sha }}
          build-args: |
            VERSION=dev-${{ github.sha }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.time.outputs.value }}
          provenance: mode=max
          sbom: true
      - name: Record build identity
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          IMAGE_ROLE: frontend
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          jq -n --arg c "$SOURCE_COMMIT" --arg r "$IMAGE_ROLE" --arg d "$IMAGE_DIGEST" --argjson m "$BUILD_METADATA" \
            '{sourceCommit: $c, role: $r, digest: $d, metadata: $m}' > "$RUNNER_TEMP/identity.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/image.tar
            ${{ runner.temp }}/identity.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-tests-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
